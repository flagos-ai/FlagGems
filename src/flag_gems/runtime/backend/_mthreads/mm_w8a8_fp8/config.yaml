# FP8 operands, FP32 accumulation; shared-memory sizes are in FP8 bytes.
# Default and expanded spaces use the same loader and descriptor pre-hook.
mm_w8a8_fp8_musa_ws_default:
  - &ws_small_default
    param_map: &ws_parameters
      META:
        BM: bm
        BN: bn
        BK: bk
        NC: nc
        CW: cw
        PW: pw
        STAGES: stages
        GM: gm
      num_stages: compiler_stages
      num_warps: cw
    bm: [64]
    bn: [64]
    bk: [128, 512]
    nc: [1]
    cw: [8]
    pw: [4]
    stages: [1, 3]
    gm: [1]
    compiler_stages: [1]
  - &ws_large_default
    <<: *ws_small_default
    bm: [128]
    bn: [256]
    bk: [128]
    cw: [16]
    stages: [3, 4]
    gm: [4]

# Explicit pipe slots are independent of compiler num_stages (kept at 1).
# All combinations surviving resource/layout pruning are measured, not sampled.
mm_w8a8_fp8_musa_ws:
  - &ws_expanded
    <<: *ws_small_default
    bm: [32, 64, 128, 256, 512]
    bn: [32, 64, 128, 256, 512]
    bk: [64, 128, 256, 512]
    nc: [1, 2, 3, 4]
    cw: [4, 8, 16]
    pw: [4, 8]
    stages: [1, 2, 3, 4, 5, 6]
    gm: [1, 2, 4, 8]

mm_w8a8_fp8_musa_ws_fragmented_default:
  - &fragmented_control
    <<: *ws_small_default
    param_map:
      <<: *ws_parameters
      META:
        BM: bm
        BN: bn
        BK: bk
        NC: nc
        CW: cw
        PW: pw
        STAGES: stages
        GM: gm
        FRAGMENTED: fragmented
    bm: [128]
    bn: [128]
    bk: [128]
    nc: [2]
    cw: [8]
    pw: [8]
    stages: [4]
    gm: [4]
    fragmented: [false]
  - &fragmented_default
    <<: *fragmented_control
    bm: [256]
    bk: [64]
    stages: [4, 5]
    gm: [1, 2]
    fragmented: [true]

mm_w8a8_fp8_musa_ws_fragmented:
  - *fragmented_control
  - <<: *fragmented_default
    stages: [4, 5, 6, 7]
    gm: [1, 2, 4, 8]

mm_w8a8_fp8_musa_default:
  - &small
    param_map: &parameters
      META:
        BLOCK_M: block_m
        BLOCK_N: block_n
        BLOCK_K: block_k
        GROUP_M: group_m
        PERSISTENT: persistent
      num_stages: stages
      num_warps: warps
    block_m: [16, 32, 64]
    block_n: [64]
    block_k: [32, 64, 128]
    group_m: [8]
    persistent: [false]
    stages: [1]
    warps: [4]
  - &skinny
    param_map: *parameters
    block_m: [16, 32]
    block_n: [64]
    block_k: [128, 256]
    group_m: [8]
    persistent: [false]
    stages: [2, 3]
    warps: [4]
  - &medium
    param_map: *parameters
    block_m: [32, 64, 128]
    block_n: [64, 128]
    block_k: [128, 256]
    group_m: [8]
    persistent: [false]
    stages: [3]
    warps: [4]
  - &masked
    param_map: *parameters
    block_m: [64]
    block_n: [64, 128]
    block_k: [256]
    group_m: [8]
    persistent: [false]
    stages: [1, 2]
    warps: [4]
  - &large
    param_map: *parameters
    block_m: [128]
    block_n: [256]
    block_k: [128]
    group_m: [8]
    persistent: [false]
    stages: [3]
    warps: [8]
  - &wide
    param_map: *parameters
    block_m: [256]
    block_n: [256]
    block_k: [128]
    group_m: [8]
    persistent: [false, true]
    stages: [3]
    warps: [16]
  - &short_k_tile
    param_map: *parameters
    block_m: [128]
    block_n: [128]
    block_k: [64]
    group_m: [8]
    persistent: [false]
    stages: [4]
    warps: [4]

mm_w8a8_fp8_musa:
  - *small
  - *skinny
  - *masked
  - <<: *medium
    block_k: [64, 128, 256]
    group_m: [1, 8]
    stages: [2, 3, 4]
  - <<: *large
    block_k: [64, 128, 256]
    group_m: [1, 8]
    stages: [2, 3, 4]
  - <<: *large
    block_m: [256]
    block_n: [128]
    block_k: [64, 128, 256]
    group_m: [1, 8]
    stages: [2, 3, 4]
  - <<: *wide
    group_m: [1, 8]
    stages: [2, 3]
  - *short_k_tile
