# Feature switch for the smt_rvisa eDSL kernels (mean/max/sum/softmax/
# log_softmax/mv); the default lives here and SPACEMIT_SMT_RVISA=1/0
# overrides it per process. Shaped like a config list because the loader
# wraps every top-level key in triton.Config.
spacemit_rvisa:
  - META:
      enabled: false
attention:
  # Single pinned config for the K3/QEMU backend: the generated 3x3x2x2x3
  # enumeration plus the code-appended SMALL_HEAD_DIM_CONFIGS (BLOCK_N=16)
  # makes every attention autotune benchmark ~36 configs on QEMU, and the
  # (128,32,warps=4) tile is the only combination validated to compile and
  # run correctly here (BLOCK_N=16 dots with head_dim=16 trip the
  # spestruct.inner_pack verifier in spine-opt).
  - META:
      BLOCK_M: 128
      BLOCK_N: 32
      PRE_LOAD_V: false
    num_warps: 4
    num_stages: 2
attention_bwd:
  - gen: true
    param_map:
      META: metas
      num_warps: warps
      num_stages: stages
    metas:
      - {BLOCK_M1: 32, BLOCK_N1: 128, BLOCK_M2: 128, BLOCK_N2: 32}
      - {BLOCK_M1: 64, BLOCK_N1: 128, BLOCK_M2: 64, BLOCK_N2: 64}
      - {BLOCK_M1: 64, BLOCK_N1: 128, BLOCK_M2: 64, BLOCK_N2: 32}
    warps:
      - 4
      - 8
    stages:
      - 2
      - 3
      - 4
