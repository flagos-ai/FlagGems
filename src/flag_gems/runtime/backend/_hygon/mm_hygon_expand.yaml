# Hygon MM Expanded: 5000 choices; extend existing packed BK128 tuning coverage.
# Rectangular tiles use user-row-major M/N; rocBLAS vendor MT axes are reversed.
# Retain 4983 prior choices and add 17 packed BK128 choices.
# Exclude proven async S4 capacity failures; retain synchronous S4.
# LOAD_MODE: 0=sync, 1=async A, 2=async B, 3=async A+B.
# Use mm_hygon: the generic mm generator drops backend/load fields.
# Exact shape and capability keys avoid reusing a different input regime.
mm:
  # generic sync: 1024 candidates.
  - config:
    param_map:
      META:
        BLOCK_M: block_m
        BLOCK_N: block_n
        BLOCK_K: block_k
        GROUP_M: group_m
        LOAD_MODE: load_mode
        mmac_warps_m: mmac_warps_m
        mmac_transposed: mmac_transposed
        optimize_epilogue: optimize_epilogue
        schedule_hint: schedule_hint
        kpack: kpack
        waves_per_eu: waves_per_eu
      num_stages: stages
      num_warps: warps
    block_m: [16, 32, 64, 128]
    block_n: [16, 32, 64, 128]
    block_k: [16, 32, 64, 128]
    group_m: [1, 8]
    load_mode: [0]
    mmac_warps_m: [0]
    mmac_transposed: [false]
    optimize_epilogue: [false, true]
    schedule_hint: ["none"]
    kpack: [1]
    waves_per_eu: [1]
