# FlagTune search domains for Hygon RouterGEMM kernel variants.
# The registered strategies keep exact tuning keys.

router_gemm_hygon_matrix:
  - param_map:
      META: {BLOCK_M: block_m, BLOCK_N: block_n, BLOCK_K: block_k, GROUP_M: group_m}
      num_warps: warps
      num_stages: stages
    block_m: [16, 32]
    block_n: [16, 32, 64]
    block_k: [128, 256]
    group_m: [1, 4]
    warps: [4]
    stages: [2]
  - param_map:
      META: {BLOCK_M: block_m, BLOCK_N: block_n, BLOCK_K: block_k, GROUP_M: group_m}
      num_warps: warps
      num_stages: stages
    block_m: [64]
    block_n: [64, 128]
    block_k: [32, 64, 128]
    group_m: [4]
    warps: [4]
    stages: [2]
  - param_map:
      META: {BLOCK_M: block_m, BLOCK_N: block_n, BLOCK_K: block_k, GROUP_M: group_m}
      num_warps: warps
      num_stages: stages
    block_m: [128]
    block_n: [128, 256]
    block_k: [32, 64]
    group_m: [8]
    warps: [8]
    stages: [1, 2]

router_gemm_hygon_vector:
  - param_map:
      META: {BN: bn, BK: bk}
      num_warps: warps
      num_stages: stages
    bn: [1, 2, 4]
    bk: [512, 1024, 2048]
    warps: [2, 4]
    stages: [2]
  - param_map:
      META: {BN: bn, BK: bk}
      num_warps: warps
      num_stages: stages
    bn: [8]
    bk: [512]
    warps: [4]
    stages: [2]

router_gemm_hygon_shared_vector:
  - param_map:
      META: {BM: bm, BN: bn, BK: bk}
      num_warps: warps
      num_stages: stages
    bm: [1, 2]
    bn: [4]
    bk: [512, 1024, 2048]
    warps: [4]
    stages: [2]
  - param_map:
      META: {BM: bm, BN: bn, BK: bk}
      num_warps: warps
      num_stages: stages
    bm: [2]
    bn: [8]
    bk: [512]
    warps: [4]
    stages: [2]

router_gemm_hygon_split:
  - param_map:
      META: {BM: bm, BN: bn, BK: bk, SK: sk}
      num_warps: warps
      num_stages: stages
    bm: [16, 32]
    bn: [16, 32, 64]
    bk: [128]
    sk: [4, 8, 16]
    warps: [4]
    stages: [2]
  - param_map:
      META: {BM: bm, BN: bn, BK: bk, SK: sk}
      num_warps: warps
      num_stages: stages
    bm: [16]
    bn: [16]
    bk: [256]
    sk: [8]
    warps: [4]
    stages: [2]
  - param_map:
      META: {BM: bm, BN: bn, BK: bk, SK: sk}
      num_warps: warps
      num_stages: stages
    bm: [32, 64]
    bn: [64, 128]
    bk: [64]
    sk: [4, 8, 16]
    warps: [4]
    stages: [2]

router_gemm_hygon_aligned_split:
  - param_map:
      META: {BM: bm, BN: bn, BK: bk, SK: sk, GROUP_M: group_m, matrix_instr_nonkdim: matrix_instr_nonkdim, kpack: kpack}
      num_warps: warps
      num_stages: stages
    bm: [16]
    bn: [16, 64]
    bk: [128]
    sk: [4, 8, 16]
    group_m: [1]
    matrix_instr_nonkdim: [16]
    kpack: [2]
    warps: [2, 4]
    stages: [2]
  - param_map:
      META: {BM: bm, BN: bn, BK: bk, SK: sk, GROUP_M: group_m, matrix_instr_nonkdim: matrix_instr_nonkdim, kpack: kpack}
      num_warps: warps
      num_stages: stages
    bm: [16]
    bn: [32]
    bk: [64, 128]
    sk: [8]
    group_m: [1]
    matrix_instr_nonkdim: [0]
    kpack: [1]
    warps: [2, 4]
    stages: [2]
  - param_map:
      META: {BM: bm, BN: bn, BK: bk, SK: sk, GROUP_M: group_m, matrix_instr_nonkdim: matrix_instr_nonkdim, kpack: kpack}
      num_warps: warps
      num_stages: stages
    bm: [32]
    bn: [32, 64]
    bk: [128]
    sk: [4]
    group_m: [2]
    matrix_instr_nonkdim: [16]
    kpack: [2]
    warps: [4]
    stages: [2]
  - param_map:
      META: {BM: bm, BN: bn, BK: bk, SK: sk, GROUP_M: group_m, matrix_instr_nonkdim: matrix_instr_nonkdim, kpack: kpack}
      num_warps: warps
      num_stages: stages
    bm: [16, 32]
    bn: [32, 64]
    bk: [128]
    sk: [8]
    group_m: [2]
    matrix_instr_nonkdim: [0]
    kpack: [1]
    warps: [4]
    stages: [2]
  - param_map:
      META: {BM: bm, BN: bn, BK: bk, SK: sk, GROUP_M: group_m, matrix_instr_nonkdim: matrix_instr_nonkdim, kpack: kpack}
      num_warps: warps
      num_stages: stages
    bm: [16]
    bn: [64]
    bk: [128]
    sk: [8]
    group_m: [1]
    matrix_instr_nonkdim: [0]
    kpack: [1]
    warps: [4]
    stages: [2]

router_gemm_hygon_narrow_vector:
  - param_map:
      META: {BM: bm, BN: bn, BK: bk}
      num_warps: warps
      num_stages: stages
    bm: [1, 2]
    bn: [1, 2]
    bk: [256, 512, 1024]
    warps: [2, 4]
    stages: [2]

router_gemm_hygon_narrow_matrix:
  - param_map:
      META: {BM: bm, BN: bn, BK: bk}
      num_warps: warps
      num_stages: stages
    bm: [16, 32]
    bn: [16, 32, 64]
    bk: [128, 256]
    warps: [2, 4]
    stages: [2]
  - param_map:
      META: {BM: bm, BN: bn, BK: bk}
      num_warps: warps
      num_stages: stages
    bm: [64]
    bn: [32, 64]
    bk: [128, 256]
    warps: [4]
    stages: [1, 2]
