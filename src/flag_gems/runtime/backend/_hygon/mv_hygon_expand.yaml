# gfx936 MV Expanded: a regular geometry domain, 645 candidates.
# The loop's explicit LOOP_STAGES controls pipelining. For this non-dot kernel,
# global num_stages=2/3/4 reaches the same loop-stage policy; keep one value.
# BLOCK_M is the reduction tile, BLOCK_N the output tile. All powers of two
# in each declared interval participate, including column-major output widths.
# The mv_hygon generator retains the minimum owner waves and one replicated
# occupancy tier for every geometry and loop stage.
mv:
  - param_map:
      META:
        BLOCK_M: block_m
        BLOCK_N: block_n
        LOOP_STAGES: loop_stages
      num_warps: warps
      num_stages: stages
    block_m: [32, 64, 128, 256, 512, 1024, 2048, 4096]
    block_n: [1, 2, 4, 8, 16, 32, 64]
    loop_stages: [1, 2, 3]
    stages: [2]
    warps: [1, 2, 4, 8]
  - strategy:
      M: default
      N: default
      stride_an: default
      stride_am: default
      stride_bm: default
