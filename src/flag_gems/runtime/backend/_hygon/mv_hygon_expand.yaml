# Legacy FlagTune expanded search space for the Hygon MV implementation.
# The kernel's autotune key also contains the input strides, hence the
# mv_hygon contract in runtime.common.py.
mv:
  - param_map:
      META:
        BLOCK_M: block_m
        BLOCK_N: block_n
        LOOP_STAGES: loop_stages
      num_warps: warps
      num_stages: stages
    block_m:
      - 32
      - 64
      - 128
      - 256
      - 512
      - 1024
      - 2048
      - 4096
    block_n:
      - 1
      - 2
      - 4
      - 8
      - 16
    loop_stages:
      - 1
      - 2
      - 3
    stages:
      - 2
      - 3
      - 4
    warps:
      - 1
      - 2
      - 4
      - 8
  - strategy:
      M: default
      N: default
      stride_an: default
      stride_am: default
      stride_bm: default
