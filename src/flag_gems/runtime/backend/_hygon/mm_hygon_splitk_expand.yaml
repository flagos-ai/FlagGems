# Regular global/CTA-local K partition profiles: 918 partial candidates.
# Global profiles write FP32 partials; local profiles reduce and store directly.
# Profiles derive launch dimensions within these declared allowed ranges.
mm_hygon_splitk:
  - param_map:
      META:
        BM: bm
        BN: bn
        BK: bk
        SPLITS: splits
        PROFILE: profile
      num_stages: stages
      num_warps: warps
    bm: [16, 32, 64]
    bn: [16, 32, 64]
    bk: [16, 32, 64]
    splits: [1, 2, 4, 8, 16, 32, 64]
    profile: [global_latency, global_bandwidth, global_throughput,
              global_async_b, local_sync_s1, local_sync_s2]
    stages: [1, 2, 3]
    warps: [1, 2, 4, 8]
mm_hygon_splitk_post:
  - param_map:
      META:
        BLOCK: block
      num_warps: warps
      num_stages: stages
    block: [128, 256]
    warps: [4]
    stages: [1]
