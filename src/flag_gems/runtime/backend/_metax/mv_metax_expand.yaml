# Expanded MV search spaces for FlagTune. Only consulted in EXPANDED tuning
# mode, so tune_configs.yaml keeps the typical candidates used at runtime.
#
# Generator source names upper-case to the kernel's META parameters: `block_n`
# feeds BLOCK_N, `block_m` feeds BLOCK_M, `block` feeds BLOCK. Tiles that
# overrun MetaX private memory are dropped later by _prune_tiles rather than
# being excluded here.
#
# The row and column kernels sweep mirrored spaces on purpose. Each keeps the
# matrix's unit-stride axis on the tile's inner dimension, so the row kernel
# wants a wide BLOCK_M and the column kernel a wide BLOCK_N.

mv_row:
  - config:
    param_map:
      META:
        BLOCK_N: block_n
        BLOCK_M: block_m
      num_stages: stages
      num_warps: warps
    block_n:
      - 1
      - 2
      - 4
      - 8
      - 16
      - 32
      - 64
    block_m:
      - 64
      - 128
      - 256
      - 512
      - 1024
      - 2048
      - 4096
    stages:
      - 1
    warps:
      - 1
      - 2
      - 4
      - 8
  - strategy:
      M: align32
      K: align32
      SAM: default
      SAK: default
      SXK: default
      SYM: default

mv_column:
  - config:
    param_map:
      META:
        BLOCK_N: block_n
        BLOCK_M: block_m
      num_stages: stages
      num_warps: warps
    block_n:
      - 1
      - 2
      - 4
      - 8
      - 16
      - 32
      - 64
      - 128
      - 256
      - 512
      - 1024
    block_m:
      - 16
      - 32
      - 64
      - 128
      - 256
      - 512
    stages:
      - 1
    warps:
      - 1
      - 2
      - 4
      - 8
  - strategy:
      M: align32
      K: align32
      BATCH: default
      SAB: default
      SAM: default
      SAK: default
      SXB: default
      SXK: default
      SYB: default
      SYM: default
      SPLIT_K: default

mv_reduce:
  - config:
    param_map:
      META:
        BLOCK: block
      num_stages: stages
      num_warps: warps
    block:
      - 32
      - 64
      - 128
      - 256
      - 512
    stages:
      - 1
    warps:
      - 1
      - 2
      - 4
  - strategy:
      M: align32
      BATCH: default
      SPLIT_K: default
      SYB: default
      SYM: default
