# Shared BLOCK_* configurations used by _compute_linear_combination.
# The MetaX MM operator uses the mm_* families below.
mm:
  - config:
    param_map:
      META:
        BLOCK_M: block_m
        BLOCK_N: block_n
        BLOCK_K: block_k
        pipeline: pipeline
        scenario: scenario
      num_stages: stages
      num_warps: warps
    block_m:
      - 16
      - 32
      - 64
      - 128
      - 256
    block_n:
      - 32
      - 64
      - 128
      - 256
    block_k:
      - 16
      - 32
      - 64
      - 128
    stages:
      - 2
      - 3
      - 4
    warps:
      - 2
      - 4
      - 8
    pipeline:
      - "null"
      - "basic"
      - "cpasync"
    scenario:
      - ""
  - strategy:
      M: default
      N: default
      K: default
      stride_am: default
      stride_bk: default

