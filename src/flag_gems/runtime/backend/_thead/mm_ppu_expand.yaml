# Batched spaces are bounded neighborhoods of the MM Pareto families. Batch
# occupancy, layout, and fused bias remain independent tuning keys.
bmm_ppu:
  - config:
    param_map:
      META:
        BLOCK_M: block_m
        BLOCK_N: block_n
        BLOCK_K: block_k
        GROUP_M: group_m
        LOAD_MODE: load_mode
      num_stages: stages
      num_warps: warps
    block_m: [32, 64, 128]
    block_n: [16, 32]
    block_k: [32, 64]
    group_m: [1]
    load_mode: [0, 3]
    stages: [4, 5]
    warps: [4]
  - config:
    param_map:
      META:
        BLOCK_M: block_m
        BLOCK_N: block_n
        BLOCK_K: block_k
        GROUP_M: group_m
        LOAD_MODE: load_mode
      num_stages: stages
      num_warps: warps
    block_m: [32]
    block_n: [64, 128]
    block_k: [32, 64]
    group_m: [1, 4]
    load_mode: [0, 1, 3]
    stages: [2, 3]
    warps: [4]
  - config:
    param_map:
      META:
        BLOCK_M: block_m
        BLOCK_N: block_n
        BLOCK_K: block_k
        GROUP_M: group_m
        LOAD_MODE: load_mode
      num_stages: stages
      num_warps: warps
    block_m: [64, 128]
    block_n: [128, 256]
    block_k: [32, 64]
    group_m: [8]
    load_mode: [0, 3]
    stages: [3, 4]
    warps: [8]
  - config:
    param_map:
      META:
        BLOCK_M: block_m
        BLOCK_N: block_n
        BLOCK_K: block_k
        GROUP_M: group_m
        LOAD_MODE: load_mode
      num_stages: stages
      num_warps: warps
    block_m: [32, 64]
    block_n: [256, 512]
    block_k: [32]
    group_m: [1]
    load_mode: [3]
    stages: [3, 4]
    warps: [4, 8]
  - config:
    param_map:
      META:
        BLOCK_M: block_m
        BLOCK_N: block_n
        BLOCK_K: block_k
        GROUP_M: group_m
        LOAD_MODE: load_mode
      num_stages: stages
      num_warps: warps
    # Wider N tiles amortize launch and descriptor work for partially filled
    # BM32 NT batches without increasing the physical row tile.
    block_m: [32]
    block_n: [256, 512]
    block_k: [64]
    group_m: [1, 4]
    load_mode: [0, 1, 2, 3]
    stages: [2]
    warps: [4, 8]
  - config:
    param_map:
      META:
        BLOCK_M: block_m
        BLOCK_N: block_n
        BLOCK_K: block_k
        GROUP_M: group_m
        LOAD_MODE: load_mode
      num_stages: stages
      num_warps: warps
    block_m: [32]
    block_n: [256]
    block_k: [128]
    group_m: [1, 4]
    load_mode: [0, 1, 2, 3]
    stages: [2]
    warps: [4, 8]
  - strategy:
      FUSE_BIAS: default
      READ_BIAS: default
      B_TRANSPOSED: default
      aiu_load_mask: default
      batch: default
      M: default
      N: default
      K: default

bmm_ppu_narrow_n:
  - config:
    param_map:
      META:
        BLOCK_M: block_m
        BLOCK_N: block_n
        BLOCK_K: block_k
        GROUP_M: group_m
        LOAD_MODE: load_mode
      num_stages: stages
      num_warps: warps
    block_m: [64, 128]
    block_n: [64]
    block_k: [32, 64]
    group_m: [1]
    load_mode: [0, 3]
    stages: [3, 4, 5]
    warps: [4]
  - config:
