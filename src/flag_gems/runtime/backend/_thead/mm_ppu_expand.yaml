      num_stages: stages
      num_warps: warps
    block_m: [32, 64]
    block_n: [16, 32, 64, 128, 256, 512, 1024]
    block_k: [32, 64, 128, 256]
    group_m: [1]
    load_mode: [0, 1, 3]
