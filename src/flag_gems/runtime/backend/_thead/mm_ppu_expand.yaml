    block_n: [64, 128, 256, 512]
    block_k: [32, 64]
    load_mode: [0, 2, 3]
    stages: [3, 4]
    warps: [4]
  - config:
    param_map:
      META:
        BLOCK_N: block_n
        BLOCK_K: block_k
        LOAD_MODE: load_mode
      num_stages: stages
      num_warps: warps
    block_n: [1024]
    block_k: [32, 64]
    load_mode: [0, 1, 3]
    stages: [3, 4]
    warps: [8]
  - config:
    param_map:
      META:
        BLOCK_N: block_n
        BLOCK_K: block_k
        LOAD_MODE: load_mode
      num_stages: stages
      num_warps: warps
    # Deep NT reductions benefit from fewer K iterations. Keep this
    # neighborhood within the shared compiler/resource prune envelope.
    block_n: [64, 128, 256]
    block_k: [128, 256]
    load_mode: [0, 2, 3]
    stages: [2]
    warps: [4, 8]
  - strategy:
      FUSE_BIAS: default
      READ_BIAS: default
      B_TRANSPOSED: default
      aiu_load_mask: default
      batch: default
      M: default
      N: default
      K: default

