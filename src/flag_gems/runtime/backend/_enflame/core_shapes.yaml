# The foreach list operators build 16 tensors per call; falling back to shapes with
# 1024**3 elements in DEFAULT_SHAPES would OOM in float32 on a 144 GiB device.
# Explicitly use medium-sized shapes consistent with the common benchmark/core_shapes.yaml.
ForeachOpsBenchmark:
  shapes:
    - [256, 256]
    - [512, 512]
    - [1024, 1024]
  shape_desc: "M, N (per tensor, list of 16)"

