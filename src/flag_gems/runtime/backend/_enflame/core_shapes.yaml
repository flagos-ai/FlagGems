    - [1048576] # 1024 * 1024
    - [64, 64]
    - [4096, 4096]
    - [64, 512, 512]
    - [256, 1024, 1024]

# The default shape set of `_softmax_backward_data` / `.out` (DEFAULT_SHAPES in
# benchmark/consts.py) leads with the 1-D shape (1073741824,), for which the native
# `topsatenSoftmaxBackwardData` of this backend returns TOPSATEN_STATUS_NOT_SUPPORT and the C++
# layer aborts the process with std::runtime_error (so the baseline cannot be timed).
# The same shape set as softmax_backward is used here: keep the 1-D (1M) coverage and use 3-D for
# the huge cases.
softmax_backward_data:
  shapes:
    - [1048576] # 1024 * 1024
    - [64, 64]
    - [4096, 4096]
    - [64, 512, 512]
    - [256, 1024, 1024]

softmax_backward_out:
  shapes:
    - [1048576] # 1024 * 1024
    - [64, 64]
    - [4096, 4096]
    - [64, 512, 512]
    - [256, 1024, 1024]

