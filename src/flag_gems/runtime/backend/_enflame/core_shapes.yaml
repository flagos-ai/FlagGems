# kron output is M=a*a, N=b*b (operands share the input shape), so memory grows
# as (a*b)^2. The GenericBenchmark2DOnly shapes above are far too large for kron
# on GCU300 (e.g. (256,256) -> 4.29e9 elems = 16 GiB in fp32 -> OOM). Use a
# dedicated small-shape set so the kron benchmark stays within device memory.
# Largest here is (160,160) -> 2.44 GiB (fp32) / 1.22 GiB (fp16).
kron:
  shapes:
    - [64, 64]
    - [96, 96]
    - [128, 128]
    - [160, 160]
  shape_desc: "M, N"

