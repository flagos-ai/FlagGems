# tile / repeat_interleave amplify volume; avoid falling back to UnaryPointwise
# giant 1-D shapes (e.g. 536870912) that overflow GCU grid launch ints.
tile:
  shapes:
    - [16, 256, 256]
    - [64, 64, 64]
    - [256, 128, 64]
    - [512, 32, 32]
    - [64, 64, 64, 64]

repeat_interleave_self_int:
  shapes:
    - [16, 256, 256]
    - [64, 64, 64]
    - [256, 128, 64]
    - [512, 32, 32]
    - [64, 64, 64, 64]

# self_Tensor scales the output volume by sum(repeats), so the generic
# Benchmark fallback shapes (e.g. [1024, 1024, 1024] with 1024 repeats) ask for
# a ~60 GiB output and fail with GCU OOM. Keep the op on the small shape set its
# benchmark class already declares as DEFAULT_SHAPES.
repeat_interleave_self_tensor:
  shapes:
    - [16, 256, 256]
    - [128, 256, 256]
    - [64, 64, 64, 64]

# repeat_interleave.Tensor only uses shape[0] to size the repeats vector, so the
# generic 1-D/3-D fallback buys nothing; keep the ladder its benchmark class declares.
repeat_interleave_tensor:
  shapes:
    - [16, 256, 256]
    - [128, 256, 256]
    - [64, 64, 64, 64]

# O(N*C^2) backward: the generic 2-D fallback contains [4096, 4096], i.e. about
# 7e10 multiply-adds per iteration, which stalls the core-stage benchmark.
# Pin the same small 2-D ladder the shared benchmark/core_shapes.yaml declares.
multilabel_margin_loss_backward:
  shapes:
    - [8, 128]
    - [32, 256]
    - [16, 512]
    - [8, 1024]
    - [2, 2048]
    - [1, 4096]
  shape_desc: "N, C"

# index_put_impl_ input_fn consumes (input_shape, indices_shape, values_shape,
# is_bool). The generic fallback asks for a [1024, 1024, 1024] destination
# tensor (4 GiB) and fails, so pin a bounded ladder that still covers 1-D, 2-D,
# 3-D scatter and the boolean-mask path.
index_put_impl_:
  shapes:
    - [[1048576], [[65536]], [65536], false]
    - [[32, 32], [[8], [8]], [8], false]
    - [[1024, 1024], [[64], [64]], [64], false]
    - [[512, 512, 512], [[128], [128], [128]], [128], false]
    - [[512, 512], [[512, 512]], [262144], true]
  shape_desc: "input_shape, indices_shape, values_shape, is_bool"

# cdist_backward input_fn unpacks (batch, n1, dim); avoid 1-D UnaryPointwise fallback.
cdist_backward:
  shapes:
