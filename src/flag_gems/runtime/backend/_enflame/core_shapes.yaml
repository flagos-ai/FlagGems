    - [256, 256]
    - [512, 512]
    - [1024, 1024]
  shape_desc: "M, N (per tensor, list of 16)"

# GCU400-specific: the matrix_norm reference requires at least 2 dimensions.
# The common core_shapes.yaml has this entry, but the enflame backend shape file is missing,
# so set_shapes falls back to 1D DEFAULT_SHAPES and the reference side raises
# "A must have at least 2 dimensions". Add valid 2D/3D/4D shapes here.
linalg_matrix_norm_out:
  shapes:
    - [256, 512]
    - [2, 2048]
    - [4, 32, 64]
    - [16, 2, 2048]
    - [8, 4, 32, 32]
  shape_desc: "(*B), M, N"

linalg_matrix_norm:
  shapes:
    - [256, 512]
    - [2, 2048]
    - [4, 32, 64]
    - [16, 2, 2048]
    - [8, 4, 32, 32]
  shape_desc: "(*B), M, N"

# The vendor shape file replaces the shared benchmark/core_shapes.yaml, and its
# `Benchmark:` class entry shadows any op that only exists in the shared table:
# such an op gets the 1-D DEFAULT_SHAPES and its input builder fails with
# "ValueError: not enough values to unpack". Mirror the shared entries below.
embedding_spmdm: &embedding_spmdm_shapes
  shapes:
    - [1024, 32, 64, 8]
    - [1024, 64, 64, 16]
    - [4096, 64, 128, 32]
    - [4096, 128, 128, 32]
    - [8192, 128, 256, 16]
    - [8192, 256, 256, 32]
    - [16384, 128, 512, 64]
    - [32768, 256, 256, 64]
    - [65536, 128, 1024, 32]
    - [131072, 64, 2048, 16]
  shape_desc: "V, D, B, S"

embedding_spmdm_weighted:
  <<: *embedding_spmdm_shapes

embedding_spmdm_grad:
  <<: *embedding_spmdm_shapes

embedding_spmdm_grad_weighted:
  <<: *embedding_spmdm_shapes

# Without this entry the op falls back to the 1-D DEFAULT_SHAPES, where the
# builder materialises ~1 GiB tensors and the benchmark never finishes.
index_select_backward:
