adaptive_max_pool2d:
  # gcu400: OUT_PER_BLOCK sweep, same ladder as adaptive_max_pool3d.  Both
  # kernels (divisible fast path _adaptive_max_pool2d_div_kernel and the
  # general _adaptive_max_pool2d_kernel) take OUT_PER_BLOCK from this list;
  # KH/KW and MAX_WIN_H/MAX_WIN_W are bound at the call site.
  # Without this entry the loader falls back to the nvidia default configs
  # (BLOCK_H/BLOCK_W), which leaves OUT_PER_BLOCK unbound and the launch
  # fails with "dynamic_func() missing 1 required positional argument".
  - META:
      OUT_PER_BLOCK: 1024
    num_warps: 16
    num_stages: 3
  - META:
      OUT_PER_BLOCK: 1024
    num_warps: 8
    num_stages: 3
  - META:
      OUT_PER_BLOCK: 256
    num_warps: 8
    num_stages: 3
  - META:
      OUT_PER_BLOCK: 128
    num_warps: 4
    num_stages: 4
  - META:
      OUT_PER_BLOCK: 64
    num_warps: 2
    num_stages: 5

quantized_max_pool3d:
  # gcu400: 1-D grid pooling kernel, tuned on (4,3,16,56,56) /
  # (4,3,16,128,128). The kernel is load-instruction bound (~7.6 GB/s of
  # strided byte gathers), so tile shape is a weak lever: an exhaustive
  # 15-config sweep only moved these shapes by ~2%. What does matter is the
  # program count - num_warps=1 wins once ~2K programs are in flight, while
  # few-program shapes want the largest tile with the highest warp count.
  - META:
      BLOCK_H: 16
      BLOCK_W: 32
    num_warps: 1
    num_stages: 3
  - META:
      BLOCK_H: 8
      BLOCK_W: 32
    num_warps: 1
    num_stages: 3
  - META:
      BLOCK_H: 4
      BLOCK_W: 32
    num_warps: 1
    num_stages: 3
  - META:
      BLOCK_H: 64
      BLOCK_W: 64
    num_warps: 8
    num_stages: 3

quantized_max_pool3d_channel:
  # gcu400: channel-tiled variant (folded (channel, height) row axis), used
  # when the input has >= 512 (n, c) planes. Winners for (8,64,8,28,28) /
  # (16,128,4,14,14) / (32,256,2,7,7); the last one needs the widest channel
  # tile (128 planes, 8 warps) for another 9%. Without this entry the loader
  # falls back to the nvidia default configs (BLOCK_H/BLOCK_W), which leaves
  # BLOCK_C unbound and the launch fails with "dynamic_func() missing 3
