# ═══════════════════════════════════════════════════════════════════════════════
# 285B 模型算子 Profiling — FlagGems Benchmark Shapes
#
# 采集日期   : 2026-11-16
# 硬件       : 8×H100 80GB
# 运行时     : vllm_fl + USE_FLAGGEMS=1（bf16 权重，未量化）
# 服务配置   : TP=8  max-model-len=40960  max-num-seqs=64
#              max-num-batched-tokens=8192  util=0.95
#
# 模型架构   : DeepSeek-V3.2（285B MoE）
#
# 收录原则
#   仅收录 FlagGems 已注册且 CSV 中有 concrete tensor shape 的算子。
#   decode 阶段走 CUDA Graph，shape 由 eager 模式推导。
#   算子命名与 FlagGems op_name 对齐，shape 格式匹配各 Benchmark 子类约定：
#     - BlasBenchmark (mm/bmm)      : [b, m, n, k]
#     - GenericBenchmark2DOnly      : [M, N]  (rms_norm)
#     - GenericBenchmark / binary   : [M, N]  (add, mul, copy_)
#     - GenericBenchmark unary      : [M, N]  (silu, zeros)
#     - GenericBenchmark scalar     : [N]     (fill_scalar, zeros scalar)
#     - UnaryReductionBenchmark     : [M, N]  (softmax)
#
# 用法
#   # 仅跑 YAML 中列出算子的 profiling shapes：
#   pytest benchmark/test_mm.py benchmark/test_bmm.py \
#          benchmark/test_rms_norm.py benchmark/test_add.py \
#          benchmark/test_mul.py benchmark/test_copy.py \
#          benchmark/test_fill.py benchmark/test_zeros.py \
#          benchmark/test_silu.py \
#          benchmark/test_softmax.py \
#          --model-profile benchmark/model_shapes/285B.yaml --level core
#
#   # 或使用 benchmark_for_models.py 自动推导 marker：
#   python benchmark/benchmark_for_models.py \
#          --shape-file benchmark/model_shapes/285B.yaml
# ═══════════════════════════════════════════════════════════════════════════════

# ── cuBLAS 线性层 GEMM (aten::mm) ─────────────────────────────────────────────
# prefill 10.99%，decode 23.86%。主要 shape：q_a/q_b/kv_a/kv_b/o_proj 投影。
# shape 格式: [b, m, n, k] — 与 BlasBenchmark 约定一致。
# 优化建议: 小 M(decode) 用 GEMV/split-K 专用内核；大 M 调 tile；可探索 FP8 权重。
mm:
  profiling:
    prefill:
      pct: 10.99
      calls: 35520
    decode:
      pct: 23.86
      calls: 84760
  shapes:
    # prefill  M=8192  K=1536 → N=3072  (q_a 投影)
    - [1, 8192, 3072, 1536]
    # prefill  M=8192  K=2048 → N=4096
    - [1, 8192, 4096, 2048]
    # prefill  M=8192  K=4096 → N=512   (kv_a 投影, lora_rank=512)
    - [1, 8192, 512, 4096]
    # prefill  M=8192  K=4096 → N=256
    - [1, 8192, 256, 4096]
    # prefill  M=8192  K=4096 → N=2112
    - [1, 8192, 2112, 4096]
    # prefill  M=8192  K=4096 → N=4608
    - [1, 8192, 4608, 4096]
    # prefill  M=8192  K=4096 → N=192
    - [1, 8192, 192, 4096]
    # prefill  M=8192  K=1536 → N=8192  (o_proj)
    - [1, 8192, 8192, 1536]
    # prefill  M=8192  K=2304 → N=4096
    - [1, 8192, 4096, 2304]
    # decode   M=1     K=4096 → N=16384 (小 M GEMV 形态)
    - [1, 1, 16384, 4096]
  shape_desc: "b, M, N, K"

# ── MLA score BMM (aten::bmm) ─────────────────────────────────────────────────
# prefill 1.89%，decode 3.53%。Q×K^T 和 score×V 两步 BMM。
# shape 格式: [b, m, n, k] — 与 BlasBenchmark 约定一致。
# 优化建议: Q/KV 布局与 CTA 调度；head_dim 专用 tile、提高 smem 复用。
bmm:
  profiling:
    prefill:
      pct: 1.89
      calls: 6480
    decode:
      pct: 3.53
      calls: 14400
  shapes:
    # prefill  Q×K^T: [16, 8192, 128] × [16, 128, 512]
    - [16, 8192, 512, 128]
    # prefill  score×V: [16, 8192, 512] × [16, 512, 128]
    - [16, 8192, 128, 512]
    # decode   Q×K^T: [16, 128, 128] × [16, 128, 512]
    - [16, 128, 512, 128]
    # decode   score×V: [16, 128, 512] × [16, 512, 128]
    - [16, 128, 128, 512]
  shape_desc: "b, M, N, K"

# ── add (aten::add) ───────────────────────────────────────────────────────────
# prefill 逐元素族约 4.73%，decode 约 5.8%。残差加等逐元素操作。
# shape 格式: [M, N] — 与 BinaryPointwiseBenchmark 约定一致。
# 优化建议: 合并相邻逐元素操作，避免多趟 kernel 启动与显存往返。
add:
  profiling:
    prefill:
      pct: 4.73
      calls: 36272
    decode:
      pct: 5.80
      calls: 79392
  shapes:
    # prefill  tokens=8192  hidden=4096  (主残差路径)
    - [8192, 4096]
    # prefill  tokens=8192  shape from copy_ family
    - [8192, 2048]
    # decode   tokens=128
    - [128, 4096]
    - [128, 2048]
  shape_desc: "M, N"

# ── copy_ (aten::copy_) ───────────────────────────────────────────────────────
# prefill 2.49%（含 DtoD），decode 1.02%。设备内拷贝与逐元素赋值。
# shape 格式: [M, N] — 与 BinaryPointwiseBenchmark / CopyInplaceBenchmark 约定一致。
# 优化建议: 减少 DtoD 拷贝，改为原地写或融合进相邻 kernel。
copy_:
  profiling:
    prefill:
      pct: 2.49
      calls: 11736
    decode:
      pct: 1.02
      calls: 14760
  shapes:
    # prefill  tokens=8192  per-head concat: [8192, 2, 32]
    - [8192, 64]
    # prefill  head layout: [8192, 16, 576]  → 展平为 2D
    - [8192, 576]
    # decode   tokens=128
    - [128, 576]
    - [128, 64]
  shape_desc: "M, N"

# ── fill_ / fill_scalar (aten::fill_) ────────────────────────────────────────
# prefill 0.25%，decode 0.69%。mask/index 初始化。
# shape 格式: [N] — 与 fill_scalar_input_fn 约定一致。
# 优化建议: 合并相邻逐元素操作，避免多趟 kernel 启动与显存往返。
fill_scalar:
  profiling:
    prefill:
      pct: 0.25
      calls: 5824
    decode:
      pct: 0.69
      calls: 14072
  shapes:
    # prefill  attention mask: [8192, 2048]
    - [8192, 2048]
    # prefill  small index buffers
    - [8192]
    - [64]
    - [63]
    # decode   attention mask: [128, 2048]
    - [128, 2048]
  shape_desc: "N"

# ── mul scalar (aten::mul.Scalar) ─────────────────────────────────────────────
# prefill 0.16%，decode 1.0%。RoPE / 缩放系数等标量乘。
# shape 格式: [M, N] — 与 GenericBenchmark / MulBenchmark 约定一致。
# 优化建议: 合并相邻逐元素操作，避免多趟 kernel 启动与显存往返。
mul:
  profiling:
    prefill:
      pct: 0.16
      calls: 6048
    decode:
      pct: 1.00
      calls: 13440
  shapes:
    # prefill  tokens=8192  head=256  (shared-expert scale)
    - [8192, 256]
    # decode
    - [128, 256]
  shape_desc: "M, N"

# ── zeros (aten::zeros) ───────────────────────────────────────────────────────
# prefill 0.24%，decode 0.36%。零初始化缓冲区。
# shape 格式: [M, N] — 与 GenericBenchmark / _input_fn 约定一致。
# 优化建议: 合并相邻逐元素操作，避免多趟 kernel 启动与显存往返。
zeros:
  profiling:
    prefill:
      pct: 0.24
      calls: 5256
    decode:
      pct: 0.36
      calls: 7872
  shapes:
    # prefill  zero_ for expert output buffer
    - [8192, 4096]
    # decode
    - [128, 4096]
  shape_desc: "M, N"

# ── rms_norm (Inductor 融合 RMSNorm) ─────────────────────────────────────────
# prefill 2.6%，decode 0.84%。每个 transformer block 的 input/post-attention norm。
# shape 格式: [M, N] — 与 GenericBenchmark2DOnly / rms_norm_input_fn 约定一致。
# 优化建议: 与相邻算子融合，减少一次显存往返。
rms_norm:
  profiling:
    prefill:
      pct: 2.60
      calls: 4696
    decode:
      pct: 0.84
      calls: 7928
  shapes:
    # prefill/decode  tokens=8192/128  hidden=4096
    - [8192, 4096]
    - [128, 4096]
  shape_desc: "M, N"

# ── silu (aten::silu) ─────────────────────────────────────────────────────────
# MoE 专家激活；prefill 约 0.06%。
# shape 格式: [M, N] — 与 UnaryPointwiseBenchmark 约定一致。
# 优化建议: 与 MoE GEMM 融合。
silu:
  profiling:
    prefill:
      pct: 0.06
      calls: 720
    decode:
      pct: 0.0
      calls: 0
  shapes:
    # shared-expert path:   intermediate_size=256
    - [8192, 256]
    # routed-expert path:   intermediate_size=2304
    - [8192, 2304]
  shape_desc: "M, N"

# ── softmax (aten::_softmax) ──────────────────────────────────────────────────
# decode 0.22%；prefill < 0.1%。router logit softmax。
# shape 格式: [M, N] — 与 UnaryReductionBenchmark 约定一致。
# 优化建议: 按 profiler 数据评估；可与 topK 融合。
softmax:
  profiling:
    prefill:
      pct: 0.03
      calls: 72
    decode:
      pct: 0.22
      calls: 160
  shapes:
    # router logits: [1, 131072] (256 experts × 512)
    - [1, 131072]
  shape_desc: "M, N"
