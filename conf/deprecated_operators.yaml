  for:
  - flag_gems.fused.fused_marlin_moe.fused_marlin_moe
  labels:
  - fused
  - vLLM
  - MoE
  kind:
  - NeuralNetwork
  stages:
  - beta: '5.4'
- id: fused_q_kv_rmsnorm
  description: 'Applies RMSNorm to Q and KV tensors in a single fused kernel for DeepSeekV4
