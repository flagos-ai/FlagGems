  - vllm.v1.attention.ops.deepseek_v4_ops.compute_global_topk_indices_and_lens
  labels:
  - fused
  - Attention
  - vLLM
  - DeepSeekV4
  kind:
  - NeuralNetwork
  stages:
  - beta: '5.3'
- id: concat_and_cache_mla
  description: 'Writes the latent and RoPE value into KV cache for Multi-head Latent
