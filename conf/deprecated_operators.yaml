# Deprecated fused operators. Use the implementations in
# https://github.com/flagos-ai/FlagGems-vllm instead.

ops:
- id: act_quant_triton
  description: This is a fused operator.
  for:
  - None
  labels:
  - fused
  kind:
  - Quantization
  stages:
  - beta: '5.3'
- id: add_rms_norm
  description: 'Add two inputs element-wise and apply Root Mean Square Layer Normalization.

    '
  for:
  - add_rms_norm
  labels:
  - aten
  - KernelGen
  - Normalization
  kind:
  - NeuralNetwork
  stages:
  - alpha: '5.4'
- id: apply_repetition_penalties
  description: 'Modifies logit tensors in place to penalize tokens that have already
    appeared in the generated sequence.

    '
  for:
  - _C.apply_repetition_penalties_
  labels:
  - fused
  - vLLM
  kind:
  - NeuralNetwork
  stages:
  - stable: '5.0'
- id: apply_rotary_pos_emb
  description: 'A method to incorporate positional information into the Transformer
    architecture.

    Rotary Positional Embedding (RoPE) applies position-dependent rotation to the
    query (Q)

    and key (K) vectors before computing the attention score.

    '
  for:
  - apply_rotary_pos_emb
  labels:
  - fused
  kind:
  - NeuralNetwork
  stages:
  - stable: '2.0'
- id: beam_search_score
  description: Computes beam search scores by adding cumulative log probabilities
    with new token scores.
  for:
  - beam_search_score
  labels:
  - KernelGen
  - fused
  kind:
  - Math
  stages:
  - alpha: '5.4'
- id: beam_search_score_
  description: In-place version of beam search score computation.
  for:
  - beam_search_score_
  labels:
  - KernelGen
  - fused
  kind:
  - Math
  stages:
  - alpha: '5.4'
- id: bf16_paged_mqa_logits
  description: 'Compute multi-head weighted ReLU attention logits on paged BF16

    KV cache. Uses shape-specialized Triton kernels for H=32 and H=64

    with zero-constexpr dispatch for decode-phase inference.

    '
  for:
  - bf16_paged_mqa_logits
  labels:
  - fused
  - KernelGen
  kind:
  - NeuralNetwork
  stages:
  - alpha: '5.4'
- id: bincount
  description: Count the frequency of each value in an array of non-negative integers.
  for:
  - bincount
  labels:
  - aten
  - pointwise
  - KernelGen
  kind:
  - Reduction
  stages:
  - stable: '5.0'
- id: bucket_sort_topk
  description: A wrapper of the TLE version and the Triton version bucket-sort topk
    operation.
  for:
  - None
  labels:
  - fused
  - DSA
  kind:
  - NeuralNetwork
  stages:
  - beta: '5.3'
- id: chunk_gated_delta_rule_fwd
  description: 'The forward case for `ChunkGatedDeltaRuleFunction` with Flash Linear
