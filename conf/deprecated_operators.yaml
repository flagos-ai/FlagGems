  - flag_gems.fused.fused_marlin_moe.fused_marlin_moe
  labels:
  - fused
  - vLLM
  - MoE
  kind:
  - NeuralNetwork
  stages:
  - beta: '5.4'
- id: fused_marlin_moe_w4a16_mxfp4
  description: Fused MoE with MXFP4 (E2M1) W4A16 weights packed two codes per byte
    and E8M0 scales; Triton wna16 fused-dequant GEMM with SwiGLU activation,
    aligned with vLLM's fused_marlin_moe call signature.
  for:
  - flag_gems.fused.fused_marlin_moe.fused_marlin_moe
  labels:
  - fused
  - vLLM
  - MoE
  kind:
  - NeuralNetwork
  stages:
  - beta: '5.4'
- id: fused_marlin_moe_w8a16_int8
  description: Fused MoE with GPTQ INT8 (uint8b128) W8A16 weights; Triton wna16
