  for:
  - vllm.v1.attention.ops.deepseek_v4_ops.fused_q_kv_rmsnorm
  labels:
  - fused
  - Attention
  - vLLM
  - DeepSeekV4
  kind:
  - NeuralNetwork
  stages:
  - beta: '5.3'
- id: fused_recurrent_gated_delta_rule_fwd
  description: 'The forward case for `fused_recurrent_gated_delta_rule` used in Flash
