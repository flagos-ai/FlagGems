  description: Computes the cross entropy loss between input logits and target.
  for:
  - CrossEntropyLoss
  labels:
  - fused
  - Reduction
  kind:
  - NeuralNetwork
  stages:
  - stable: '2.0'
  - removed: '3.0'
- id: cutlass_scaled_mm
