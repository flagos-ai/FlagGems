  labels:
  - fused
  - Attention
  - vLLM
  - DeepSeekV4
  kind:
  - NeuralNetwork
  stages:
  - beta: '5.3'
- id: dgeglu
  description: 'Gaussian Error Gated Linear Unit with GELU activation instead of sigmoid
    function.

    This is for the backward case.

    '
  for:
  - dgeglu
  labels:
  - fused
  - Transformer
  kind:
  - NeuralNetwork
  stages:
  - alpha: '4.2'
  - beta: '5.0'
  - stable: '5.0'
- id: dispatch_fused_moe_kernel
  description: 'Accelerates neural network training by combining token routing (dispatch/all-to-all
    communication),

    expert computation (GEMM), and result aggregation into a single GPU kernel.

    '
  for:
  - dispatch_fused_moe_kernel
  labels:
  - fused
  - Activation
  - vLLM
  kind:
  - MoE
  stages:
  - beta: '5.0'
  - stable: '5.3'
- id: dreglu
  description: 'Rectified Gated Linear Unit is a variant of GLU that uses ReLU instead
    of

    the sigmoid function for gating. This is the backward case.

    '
  for:
  - dreglu
  labels:
  - fused
  - Transformer
  kind:
  - NeuralNetwork
  stages:
  - alpha: '4.2'
  - beta: '5.3'
- id: dswiglu
  description: 'Swish-Gated Linear Unit, a variant of GLU with the Swish activation
    function.

    This is for the backward case.

    '
  for:
  - dswiglu
  labels:
  - fused
  - Transformer
  kind:
  - NeuralNetwork
  stages:
  - alpha: '5.0'
  - beta: '5.3'
- id: flash_mla
  description: A variant of Multi-head Latent Attention (MLA).
  for:
  - triton_mla._forward_decode
  labels:
  - fused
  - Attention
  - vLLM
  kind:
  - NeuralNetwork
  stages:
  - stable: '3.0'
- id: flash_mla_sparse_fwd
  description: Part of the FlashMLA.
  for:
  - vllm.v1.attention.backends.mla.flashmla_sparse
  labels:
  - fused
  - Attention
  - vLLM
  kind:
  - NeuralNetwork
  stages:
  - alpha: '5.3'
- id: fp8_fp4_mega_moe
  description: 'Functional Triton fallback for local FP8 x FP4 MegaMoE. It consumes

    staged FP8 activations, packed FP4 expert weights, scales, and top-k

    routing tensors, then computes the two-layer SwiGLU MoE output.

    '
  for:
  - flag_gems.fused.fp8_fp4_mega_moe
  - vllm.third_party.deep_gemm.fp8_fp4_mega_moe
  labels:
  - fused
  - vLLM
  - Triton
  kind:
  - MoE
  - NeuralNetwork
  stages:
  - alpha: '5.4'
- id: fp8_fp4_mqa_logits
  description: 'Compute weighted MQA logits with FP8 quantized Q and K tensors.

    Uses head-batched tiled dot products with K reuse for high throughput

    on DeepSeek V4 sparse attention indexer workloads.

    '
  for:
  - vllm.utils.deep_gemm.fp8_fp4_mqa_logits
  labels:
  - fused
  - vLLM
  - KernelGen
  kind:
  - NeuralNetwork
  stages:
  - alpha: '5.1'
- id: fp8_fp4_paged_mqa_logits
  description: 'Compute paged multi-query attention logits from FP8 queries against

    FP8/FP4 paged KV cache with per-token scaling. Used in DeepSeek-V4

    decode-phase inference with adaptive tile sizing.

    '
  for:
  - vllm.utils.deep_gemm.fp8_fp4_paged_mqa_logits
  labels:
  - fused
  - vLLM
  - DeepSeekV4
  - KernelGen
  kind:
  - NeuralNetwork
  stages:
  - beta: '5.3'
- id: fused_add_rms_norm
  description: Adds the input to the residual in place and applies weighted RMS
    normalization, storing the sum in the residual and the normalized result in the input.
  for:
  - add_rms_norm
  labels:
  - fused
  - Normalization
  kind:
  - NeuralNetwork
  stages:
  - stable: '2.0'
  cpp: '4.0'
- id: fused_deepseek_v4_qnorm_rope_kv_rope_insert
  description: 'Horizontally-fused DeepseekV4-MLA BF16 variant.

    per-head RMSNorm + GPT-J RoPE for Q, and GPT-J RoPE + bf16 paged

    cache insert for KV, all in one kernel launch. No FP8 quantization.

    '
  for:
  - fused_deepseek_v4_qnorm_rope_kv_rope_insert
  labels:
  - fused
  - KernelGen
  kind:
  - NeuralNetwork
  stages:
  - alpha: '5.4'
- id: fused_deepseek_v4_qnorm_rope_kv_rope_quant_insert
  description: 'Horizontally-fused DeepseekV4-MLA.

    per-head RMSNorm + GPT-J RoPE for Q, and GPT-J RoPE + UE8M0 FP8

    quant + paged cache insert for KV, all in one kernel launch.

    '
  for:
  - torch.ops._C.fused_deepseek_v4_qnorm_rope_kv_rope_quant_insert
  labels:
  - fused
  - vLLM
  - DeepSeekV4
  kind:
  - NeuralNetwork
  stages:
  - beta: '5.3'
- id: fused_experts_impl
  description: An implementation of fused MoE.
  for:
  - vllm.model_executor.layers.fused_moe.fused_moe.fused_experts_impl
  labels:
  - fused
  - vLLM
  - MoE
  kind:
  - NeuralNetwork
  stages:
  - beta: '5.3'
- id: fused_indexer_q_rope_quant
  description: 'Applies RoPE to sparse indexer Q, quantizes it to FP8 or MXFP4, and
    folds

    indexer weights for DeepSeekV4 attention.

    '
  for:
  - vllm.v1.attention.ops.deepseek_v4_ops.fused_indexer_q_rope_quant
  labels:
  - fused
  - Attention
  - vLLM
  - DeepSeekV4
  kind:
  - NeuralNetwork
  stages:
  - beta: '5.4'
- id: fused_inv_rope_fp8_quant
  description: 'Fused inverse RoPE and FP8 group quantization for DeepSeekV4 attention
    output. Applies GPT-J inverse rotary embedding to the rope part of every head
    and quantizes the grouped head output to FP8 with per-group scales, optionally
    packed as UE8M0 exponents.

    '
  for:
  - fused_inv_rope_fp8_quant
  name:
  - fused_inv_rope_fp8_quant
  source:
  - vllm
  labels:
  - fused
  - Attention
  - vLLM
  - DeepSeekV4
  kind:
  - NeuralNetwork
  stages:
  - beta: '5.5'
- id: fused_marlin_moe_w4a16_int4
  description: Fused MoE with GPTQ INT4 (uint4b8) W4A16 weights in plain row-major
    layout; Triton wna16 fused-dequant GEMM with SwiGLU activation, aligned with
    vLLM's fused_marlin_moe call signature.
