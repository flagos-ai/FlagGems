- id: addbmm
  description: 'Performs a batch matrix-matrix product of matrices in `batch1` and
    `batch2`,

    with a reduced add step (sum over batch dimension), and adds `input` to the result.

    Formula: out = beta * input + alpha * (sum_i batch1_i @ batch2_i).

    '
  for:
  - addbmm
  labels:
  - aten
  - KernelGen
  kind:
  - LinearAlg
  stages:
  - alpha: '5.4'
- id: addbmm_
  description: 'Inplace variant of addbmm. Performs a batch matrix-matrix product
    of matrices in

    `batch1` and `batch2`, with a reduced add step, and stores the result in `self`.

    Formula: self = beta * self + alpha * (sum_i batch1_i @ batch2_i).

    '
  for:
  - addbmm_
  labels:
  - aten
  - KernelGen
  kind:
  - LinearAlg
  stages:
  - alpha: '5.4'
- id: addcdiv
  description: 'Performs the element-wise division of `tensor1` by `tensor2`, multiplies
    the result

    by the scalar `value` and adds it to `input`.

    '
  for:
  - addcdiv
  labels:
  - aten
  - pointwise
  kind:
  - LinearAlg
  stages:
  - stable: '4.0'
- id: addcdiv_
  description: 'The in-place version of `addcdiv()`. Performs the element-wise division
    of

    `tensor1` by `tensor2`, multiplies the result by the scalar `value` and adds

    it to `input`, storing the result in `input`.

    '
  for:
  - addcdiv_
  labels:
  - aten
  - KernelGen
  kind:
  - Math
  stages:
  - alpha: '5.1'
- id: addcdiv_out
  description: 'A variant of `addcdiv()` that assigns the output to the given `out`
    parameter..

    '
  for:
  - addcdiv.out
  labels:
  - aten
  - pointwise
  - KernelGen
  kind:
  - LinearAlg
  stages:
  - beta: '5.0'
  - stable: '5.3'
- id: addcmul
  description: 'Performs the element-wise multiplication of `tensor1` by `tensor2`,

    multiplies the result by the scalar `value` and adds it to `input`.

    '
  for:
  - addcmul
  labels:
  - aten
  - pointwise
  kind:
  - LinearAlg
  stages:
  - stable: '4.0'
- id: addcmul_
  description: 'The in-place version of `addcmul()`.

    '
  for:
  - addcmul_
  labels:
  - aten
  - pointwise
  - KernelGen
  kind:
  - LinearAlg
  stages:
  - alpha: '5.4'
- id: addcmul_out
  description: 'A variant of `addcmul` that allows the output to be assigned to `out`.

    '
  for:
  - addcmul.out
  labels:
  - aten
  - pointwise
  - KernelGen
  kind:
  - LinearAlg
  stages:
  - alpha: '5.0'
  - beta: '5.3'
- id: addmm
  description: 'Performs a matrix multiplication of the matrices `mat1` and `mat2`.

    The matrix `input` is added to the final result.

    '
  for:
  - addmm
  labels:
  - aten
  kind:
  - BLAS
  stages:
  - stable: '1.0'
  cpp: '4.0'
- id: addmm_
  description: 'The in-place version of `addmm`. Performs the matrix multiplication
    of `mat1`

    and `mat2`, multiplied by `alpha`, then adds `beta` times `input` to the result

    in-place.

    '
  for:
  - addmm_
  labels:
  - aten
  - KernelGen
  kind:
  - BLAS
  stages:
  - alpha: '5.4'
- id: addmm_activation
  description: 'Performs `addmm` followed by an activation function. Computes

    `beta * input + alpha * (mat1 @ mat2)` and applies ReLU, or GELU (tanh

    approximation) when `use_gelu` is True.

    '
  for:
  - _addmm_activation
  labels:
  - aten
  - KernelGen
  kind:
  - BLAS
  stages:
  - alpha: '5.5'
- id: addmm_activation_out
  description: A variant of `_addmm_activation()` that assigns the output to the provided
    `out` parameter.
  for:
  - _addmm_activation.out
  labels:
  - aten
  - KernelGen
  kind:
  - BLAS
  stages:
  - alpha: '5.5'
- id: addmm_dtype
  description: 'A variant of `addmm` that allows the dtype of the output tensor to
    be specified.

    This is supported only on CUDA and for `torch.float32` given `torch.float16` or
    `torch.bfloat16` input dtypes.

    '
  for:
  - addmm.dtype
  labels:
  - aten
  kind:
  - BLAS
  stages:
  - beta: '5.3'
- id: addmm_dtype_out
  description: A variant of `addmm_dtype()` that allows the output to be saved to
    the provided `out` parameter.
  for:
  - addmm.dtype_out
  labels:
  - aten
  kind:
  - BLAS
  stages:
  - beta: '5.3'
- id: addmm_out
  description: 'A variant of `addmm` that assigns to the output to the provided `out`
    parameter.

    '
  for:
  - addmm.out
  labels:
  - aten
  kind:
  - BLAS
  stages:
  - stable: '4.0'
- id: addmm_out_vector_bias
