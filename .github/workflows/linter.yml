name: linter

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types:
      - opened
      - edited
      - reopened
      - synchronize

jobs:
  code-style:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    # cpu-runner is an already-running container; no container: image needed.
    runs-on: cpu-runner
    env:
      # Point pre-commit at the hook venvs prebuilt into the cpu-runner image
      # (see .github/docker/cpu-runner.Dockerfile). Without this, pre-commit
      # falls back to ~/.cache/pre-commit (empty on the ephemeral pod) and
      # rebuilds every hook env (~128s). Must match the image's PRE_COMMIT_HOME.
      PRE_COMMIT_HOME: /opt/pre-commit-cache
      # Override the platform-injected proxy (which fails ~1/3 of git fetches)
      # with a working one from secrets, so actions/checkout's fetch is reliable.
      # Only lowercase: GitHub treats env names case-insensitively, so defining
      # both http_proxy and HTTP_PROXY is a duplicate-key error that fails the
      # whole workflow to parse. git/curl honor the lowercase names.
      http_proxy: ${{ secrets.CI_HTTP_PROXY }}
      https_proxy: ${{ secrets.CI_HTTP_PROXY }}
    steps:
    - name: Diag SSH vs HTTP connectivity (temporary)
      shell: bash
      env:
        # SSH ignores http(s)_proxy; clear them here so the SSH probes test the
        # runner's direct egress, while the HTTP probe below keeps the proxy.
        GIT_SSH_COMMAND: "ssh -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o BatchMode=yes"
      run: |
        set +e  # probes exit non-zero (auth fail / timeout); don't abort the step
        probe_ssh() {  # $1=label $2=host $3=port
          start=$(date +%s%N)
          out=$(timeout 25 ssh -T -o ConnectTimeout=15 -o StrictHostKeyChecking=no \
                  -o BatchMode=yes -p "$3" "git@$2" 2>&1); rc=$?
          end=$(date +%s%N); ms=$(( (end-start)/1000000 ))
          # github returns "Hi ... successfully authenticated" or
          # "Permission denied (publickey)" once the SSH handshake works.
          if echo "$out" | grep -qiE "successfully authenticated|Permission denied|Hi "; then
            verdict="REACHABLE(handshake ok)"
          else
            verdict="UNREACHABLE"
          fi
          printf "  %-10s %d.%03ds rc=%d %s\n" "$1" "$((ms/1000))" "$((ms%1000))" "$rc" "$verdict"
          echo "    out: $(echo "$out" | head -1)"
        }
        echo "=== SSH 22 (github.com:22) ==="
        for i in 1 2 3; do probe_ssh "ssh22-$i" github.com 22; done
        echo "=== SSH 443 (ssh.github.com:443) ==="
        for i in 1 2 3; do probe_ssh "ssh443-$i" ssh.github.com 443; done
        echo "=== HTTP via proxy (git ls-remote) ==="
        for i in 1 2 3; do
          start=$(date +%s%N)
          timeout 25 git ls-remote https://github.com/flagos-ai/FlagGems.git refs/heads/master >/dev/null 2>&1 && rc=ok || rc=FAIL
          end=$(date +%s%N); ms=$(( (end-start)/1000000 ))
          printf "  http-%d %d.%03ds %s\n" "$i" "$((ms/1000))" "$((ms%1000))" "$rc"
        done
    # Checkout with up to 5 attempts, each with a hard 1-minute step timeout.
    # The proxy makes git fetch HANG (not fail) ~half the time; a hung fetch
    # ignores git's own timeouts, so only the runner's step `timeout-minutes`
    # can kill it (SIGKILL on the process tree) and let the next attempt run.
    # Success takes ~4-7s, so 1 minute is ample headroom while making a hung
    # attempt fail fast; 5 attempts drive the ~50%/attempt failure rate down to
    # ~3% overall, with a worst case of ~5 minutes instead of hanging forever.
    - id: co1
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      timeout-minutes: 1
      continue-on-error: true
    - id: co2
      if: steps.co1.outcome == 'failure'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      timeout-minutes: 1
      continue-on-error: true
    - id: co3
      if: steps.co1.outcome == 'failure' && steps.co2.outcome == 'failure'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      timeout-minutes: 1
      continue-on-error: true
    - id: co4
      if: steps.co1.outcome == 'failure' && steps.co2.outcome == 'failure' && steps.co3.outcome == 'failure'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      timeout-minutes: 1
      continue-on-error: true
    - id: co5
      if: steps.co1.outcome == 'failure' && steps.co2.outcome == 'failure' && steps.co3.outcome == 'failure' && steps.co4.outcome == 'failure'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      timeout-minutes: 1
    # checkout marks the repo safe only in a throwaway HOME; pre-commit runs
    # with HOME=/github/home and git rejects the dir as dubious ownership.
    # Register it in the persistent global config pre-commit actually reads.
    - name: Mark workspace as a safe git directory
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Ensure full working tree
      shell: bash
      run: |
        # cpu-runner reuses its _work dir across jobs. A prior job's
        # sparse checkout leaves skip-worktree bits behind that the next
        # checkout's "sparse-checkout disable" can't clear, so tracked files
        # stay absent on disk even though checkout reports success (pre-commit
        # then can't see the files it must lint). Clear any skip-worktree bits
        # and force-restore the full tree. Harmless no-op when clean.
        git sparse-checkout disable 2>/dev/null || true
        git ls-files -z | xargs -0 -r git update-index --no-skip-worktree
        git checkout --force HEAD -- .
    # pre-commit and its hook venvs are preinstalled in the cpu-runner image and
    # found via the job-level PRE_COMMIT_HOME above, so no install or hook
    # bootstrapping happens here. Invoke via `python3 -m pre_commit` since the
    # console-script entrypoint is not on the PATH inherited by steps running
    # directly on cpu-runner.
    - name: Run pre-commit
      shell: bash
      run: |
        python3 -m pre_commit run --show-diff-on-failure --color=always --all-files
