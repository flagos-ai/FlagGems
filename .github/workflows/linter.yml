name: linter

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types:
      - opened
      - edited
      - reopened
      - synchronize

# The runner injects an auth-required 407 proxy into the container; GitHub is
# reachable directly. Setting the proxy vars to '' fails (an empty container
# env renders as `docker create -e "https_proxy"`, passing the host value
# through), so bypass the proxy for every host with no_proxy=*, honored by
# git/curl. Lowercase wins in proxy-from-env (set per container below);
# NO_PROXY here covers step processes.
env:
  NO_PROXY: '*'

jobs:
  code-style:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: basic-runner-cpu
    container:
      image: harbor.baai.ac.cn/flagos-base/flagos-base-kunlunxin:0.0.2
      env:
        no_proxy: '*'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    # checkout marks the repo safe only in a throwaway HOME; pre-commit runs
    # with HOME=/github/home and git rejects the dir as dubious ownership.
    # Register it in the persistent global config pre-commit actually reads.
    - name: Mark workspace as a safe git directory
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1
