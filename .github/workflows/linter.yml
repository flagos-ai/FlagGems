name: linter

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types:
      - opened
      - edited
      - reopened
      - synchronize

# The job container runs with the host network (options: --network host below)
# so it uses the host's own network stack and proxy setup to reach GitHub,
# instead of the runner-injected in-container proxy.
jobs:
  code-style:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: basic-runner-cpu
    container:
      image: harbor.baai.ac.cn/flagos-base/flagos-base-kunlunxin:0.0.2
      options: --network host
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    # checkout marks the repo safe only in a throwaway HOME; pre-commit runs
    # with HOME=/github/home and git rejects the dir as dubious ownership.
    # Register it in the persistent global config pre-commit actually reads.
    - name: Mark workspace as a safe git directory
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1
