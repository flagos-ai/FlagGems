name: linter

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types:
      - opened
      - edited
      - reopened
      - synchronize

jobs:
  code-style:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    # cpu-runner is an already-running container; no container: image needed.
    runs-on: cpu-runner
    env:
      # Point pre-commit at the hook venvs prebuilt into the cpu-runner image
      # (see .github/docker/cpu-runner.Dockerfile). Without this, pre-commit
      # falls back to ~/.cache/pre-commit (empty on the ephemeral pod) and
      # rebuilds every hook env (~128s). Must match the image's PRE_COMMIT_HOME.
      PRE_COMMIT_HOME: /opt/pre-commit-cache
      # Override the platform-injected proxy (which fails ~1/3 of git fetches)
      # with a working one from secrets, so actions/checkout's fetch is reliable.
      http_proxy: ${{ secrets.CI_HTTP_PROXY }}
      https_proxy: ${{ secrets.CI_HTTP_PROXY }}
      HTTP_PROXY: ${{ secrets.CI_HTTP_PROXY }}
      HTTPS_PROXY: ${{ secrets.CI_HTTP_PROXY }}
    steps:
    - name: Diag checkout speed proxy-vs-direct (temporary)
      shell: bash
      run: |
        # Time the REAL work actions/checkout does — a shallow fetch of the ref
        # under test — once via the injected proxy and once direct (no proxy),
        # several rounds each, so we can compare real checkout latency/failures.
        REPO="https://github.com/flagos-ai/FlagGems.git"
        REF="${{ github.event.pull_request.head.sha || github.sha }}"
        ROUNDS=3
        PER_FETCH_TIMEOUT=20   # cap a hung fetch so the step finishes fast

        mask() { sed -E 's#(://)[^@/]*@#\1***@#g'; }
        echo "http_proxy=$(echo "${http_proxy:-<unset>}" | mask)   ref=${REF}"

        one_fetch() {  # $1 = mode label; env already set by caller
          d=$(mktemp -d)
          ( cd "$d"; git init -q .; git remote add origin "$REPO" )
          start=$(date +%s%N)
          if timeout "$PER_FETCH_TIMEOUT" git -C "$d" -c protocol.version=2 \
               fetch -q --no-tags --prune --depth=1 origin "$REF" 2>/dev/null; then
            rc=ok; else rc=FAIL; fi
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          printf "  %-6s %s: %d.%03ds\n" "$1" "$rc" "$(( ms / 1000 ))" "$(( ms % 1000 ))"
          rm -rf "$d"
        }

        echo "--- via proxy (injected http(s)_proxy) ---"
        for i in $(seq 1 $ROUNDS); do one_fetch "proxy"; done

        echo "--- direct (no proxy) ---"
        for i in $(seq 1 $ROUNDS); do
          ( export no_proxy='*' NO_PROXY='*'; unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY; one_fetch "direct" )
        done
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    # checkout marks the repo safe only in a throwaway HOME; pre-commit runs
    # with HOME=/github/home and git rejects the dir as dubious ownership.
    # Register it in the persistent global config pre-commit actually reads.
    - name: Mark workspace as a safe git directory
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Ensure full working tree
      shell: bash
      run: |
        # cpu-runner reuses its _work dir across jobs. A prior job's
        # sparse checkout leaves skip-worktree bits behind that the next
        # checkout's "sparse-checkout disable" can't clear, so tracked files
        # stay absent on disk even though checkout reports success (pre-commit
        # then can't see the files it must lint). Clear any skip-worktree bits
        # and force-restore the full tree. Harmless no-op when clean.
        git sparse-checkout disable 2>/dev/null || true
        git ls-files -z | xargs -0 -r git update-index --no-skip-worktree
        git checkout --force HEAD -- .
    # pre-commit and its hook venvs are preinstalled in the cpu-runner image and
    # found via the job-level PRE_COMMIT_HOME above, so no install or hook
    # bootstrapping happens here. Invoke via `python3 -m pre_commit` since the
    # console-script entrypoint is not on the PATH inherited by steps running
    # directly on cpu-runner.
    - name: Diag pre-commit cache (temporary)
      shell: bash
      run: |
        echo "PRE_COMMIT_HOME=$PRE_COMMIT_HOME"
        echo "--- ls -la $PRE_COMMIT_HOME ---"
        ls -la "$PRE_COMMIT_HOME" 2>&1 || echo "MISSING: $PRE_COMMIT_HOME does not exist (runner image lacks the prebuilt cache)"
        echo "--- repo dirs ---"
        ls -d "$PRE_COMMIT_HOME"/repo* 2>&1 || echo "no repo* dirs"
    - name: Run pre-commit
      shell: bash
      run: |
        python3 -m pre_commit run --show-diff-on-failure --color=always --all-files
