name: linter

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types:
      - opened
      - edited
      - reopened
      - synchronize

# The runner injects the host's proxy (HTTP_PROXY/HTTPS_PROXY) into the job
# container; the host proxy reaches GitHub, so we leave it in place and add no
# proxy overrides (no no_proxy=*, no --network host).
jobs:
  code-style:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: basic-runner-cpu
    container:
      image: harbor.baai.ac.cn/flagos-base/flagos-base-kunlunxin:0.0.2
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    # checkout marks the repo safe only in a throwaway HOME; pre-commit runs
    # with HOME=/github/home and git rejects the dir as dubious ownership.
    # Register it in the persistent global config pre-commit actually reads.
    - name: Mark workspace as a safe git directory
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    # DIAGNOSTIC (temporary): pin down why pre-commit reports
    # ".pre-commit-config.yaml is not a file" — is the cwd wrong, or has the
    # file actually gone missing after checkout? Prints cwd, workspace, and the
    # config's presence right before pre-commit runs.
    - name: Diagnose pre-commit-config presence
      shell: bash
      run: |
        echo "PWD=$(pwd)"
        echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
        echo "HOME=$HOME"
        echo "--- ls -la pwd ---"
        ls -la .
        echo "--- config in cwd ---"
        ls -la ./.pre-commit-config.yaml || echo "MISSING in cwd"
        echo "--- config in GITHUB_WORKSPACE ---"
        ls -la "$GITHUB_WORKSPACE/.pre-commit-config.yaml" || echo "MISSING in workspace"
        echo "--- git status ---"
        git -C "$GITHUB_WORKSPACE" rev-parse HEAD || true
        git -C "$GITHUB_WORKSPACE" status --porcelain=v1 | head -20 || true
    - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1
