name: "ondemand test"

on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  checks: read
  contents: read

jobs:
  preprocess:
    runs-on: ubuntu-latest
    outputs:
      continue: ${{ steps.check.outputs.continue == 'true' && steps.validate-runner.outputs.continue == 'true' }}
      op: ${{ steps.parse-command.outputs.OP_ID}}
      runner: ${{ steps.parse-command.outputs.RUNNER }}
      pull: ${{ steps.parse-command.outputs.PR_NUMBER }}
      existing: ${{ steps.parse-command.outputs.EXISTING_OP }}
      container_image: ${{ steps.lookup-container.outputs.image }}
      container_options: ${{ steps.lookup-container.outputs.options }}
      runs_on_default: ${{ steps.lookup-container.outputs.runs_on_default }}
      runs_on_vllm: ${{ steps.lookup-container.outputs.runs_on_vllm }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: check
        uses: github/command@3442f3fa1efe01bdb024b157083c337902d17372  # v2.0.3
        with:
          command: "/test"
          allowed_contexts: pull_request
          allow_forks: "true"
          skip_reviews: "true"
          fork_review_bypass: "true"
          permissions: "write,admin"
          param_separator: " "

      - id: parse-command
        if: ${{ steps.check.outputs.continue == 'true' }}
        env:
          PULL_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ steps.check.outputs.comment_body }}
        run: |
          # Parse command arguments
          # Comment format: "/test <op>:<runner>", e.g. "/test constant_pad_nd:mthreads"
          params="${COMMENT_BODY#/test }"
          op="${params%%:*}"
          runner="${params##*:}"
          echo "OP_ID=${op}" >> $GITHUB_OUTPUT
          echo "RUNNER=${runner}" >> $GITHUB_OUTPUT
          echo "PR_NUMBER=${PULL_NUMBER}" >> $GITHUB_OUTPUT

          # Detect if operator exists before
          num=$(grep -rP "pytest\.mark\.${op}\b" tests | wc -l)
          if [ "$num" -eq "0" ]; then
            echo "EXISTING_OP=0" >> $GITHUB_OUTPUT
          else
            echo "EXISTING_OP=1" >> $GITHUB_OUTPUT
          fi

      # Validates the runner alias against every label the jobs below actually
      # dispatch on (resolve-vendor's case branches + the containerized vendor
      # list). Catches typos like "nvidia-cuda133" (a backends.json id, not a
      # runner label) before they silently queue against a non-existent runner.
      - id: validate-runner
        if: ${{ steps.check.outputs.continue == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.parse-command.outputs.PR_NUMBER }}
          RUNNER: ${{ steps.parse-command.outputs.RUNNER }}
          REPO: ${{ github.repository }}
        run: |
          valid_runners=(
            h20 a100 h100
            ascend cann9
            enflame
            cambricon
            hygon mthreads metax maca381 iluvatar kunlunxin
          )

          valid="false"
          for r in "${valid_runners[@]}"; do
            if [ "${RUNNER}" = "$r" ]; then
              valid="true"
              break
            fi
          done

          if [ "$valid" = "false" ]; then
            list=$(printf '`%s`, ' "${valid_runners[@]}")
            list="${list%, }"
            gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "⚠️ Unknown runner \`${RUNNER}\` in \`/test\` command. Valid runners are: ${list}."
            echo "continue=false" >> $GITHUB_OUTPUT
          else
            echo "continue=true" >> $GITHUB_OUTPUT
          fi

      - id: lookup-container
        if: ${{ steps.check.outputs.continue == 'true' && steps.validate-runner.outputs.continue == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const backends = JSON.parse(fs.readFileSync('.github/backends.json', 'utf8'));
            // Maps the /test comment's runner alias to the backend id in backends.json
            const runnerToBackend = {
              hygon: 'hygon',
              mthreads: 'mthreads-musa520',
              metax: 'metax-maca3810',
              maca381: 'metax-maca3810',
              iluvatar: 'iluvatar',
              kunlunxin: 'kunlunxin',
            };
            const runner = '${{ steps.parse-command.outputs.RUNNER }}';
            const backendId = runnerToBackend[runner];
            const backend = backends.find(b => b.backend === backendId);
            const container = backend?.container || {};
            core.setOutput('image', container.image || '');
            core.setOutput('options', container.options || '');
            core.setOutput('runs_on_default', container.runs_on_default || '');
            core.setOutput('runs_on_vllm', container.runs_on_vllm || '');

  # Generic (non-containerized) runners. Everything except the 5 vendors whose
  # driver/runtime is only set up inside a container. The backend/vendor is
  # derived from the runner label at runtime. Uses local ./ action refs since
  # these runners resolve them against the checked-out workspace.
  test-operator:
    needs: preprocess
    if: >-
      needs.preprocess.outputs.continue == 'true' &&
      !contains(fromJSON('["hygon", "mthreads", "metax", "maca381", "iluvatar", "kunlunxin"]'), needs.preprocess.outputs.runner)
    runs-on: ${{ needs.preprocess.outputs.runner }}
    steps:
      - id: resolve-vendor
        shell: bash
        env:
          RUNNER_LABEL: ${{ needs.preprocess.outputs.runner }}
        run: |
          case "${RUNNER_LABEL}" in
            h20)
              VENDOR="nvidia"
              BACKEND="nvidia-cuda133"
              ;;
            a100)
              VENDOR="nvidia"
              BACKEND="nvidia-cuda133"
              ;;
            h100)
              # Driver 535.183.06 supports up to CUDA 12.9, so use the 12.8
              # profile (cuda133 requires a newer driver). Note: nvcc is not on
              # PATH in this node's container (cuda at /usr/local/cuda-12.9);
              # C++ extension builds may need PATH/CUDA_HOME set.
              # This node's container glibc is too old for FlagTree
              # (needs GLIBC 2.38), so use upstream Triton instead.
              VENDOR="nvidia"
              BACKEND="nvidia-cuda128"
              echo "COMPILER=triton" >> $GITHUB_ENV
              ;;
            ascend)
              VENDOR="ascend"
              BACKEND="ascend-cann900"
              ;;
            cann9)
              VENDOR="ascend"
              BACKEND="ascend-cann900"
              ;;
            enflame)
              VENDOR="enflame"
              BACKEND="enflame-tops1106"
              ;;
            cambricon)
              VENDOR="cambricon"
              BACKEND="cambricon-neuware472"
              ;;
            *)
              VENDOR="${RUNNER_LABEL}"
              BACKEND="${RUNNER_LABEL}"
              ;;
          esac
          echo "VENDOR=${VENDOR}" >> $GITHUB_ENV
          echo "BACKEND=${BACKEND}" >> $GITHUB_ENV

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        continue-on-error: true
      - uses: ./.github/actions/checkout-retry
      - uses: ./.github/actions/checkout-pr
        with:
          pull: ${{ needs.preprocess.outputs.pull }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-flaggems
        with:
          backend: ${{ env.BACKEND }}
          gpu_check_script: tools/gpu_check_${{ env.VENDOR }}.sh
      - uses: ./.github/actions/ondemand-test
        with:
          op: ${{ needs.preprocess.outputs.op }}
          backend: ${{ env.BACKEND }}
          runner: ${{ needs.preprocess.outputs.runner }}
          existing: ${{ needs.preprocess.outputs.existing }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Hygon, MetaX, MooreThreads, Iluvatar, and Kunlunxin only have their
  # driver/runtime set up inside a vendor container, mirroring backend-test.yaml.
  # The image/options/runner labels come from .github/backends.json via the
  # preprocess lookup-container step. Each runs on whichever physical machine
  # this repo has access to (FlagGems-vllm uses the "-1" host, FlagGems uses
  # "-0"), and uses fully-qualified @master action refs since local ./ refs
  # can't be resolved inside these containers.
  test-operator-hygon:
    needs: preprocess
    if: needs.preprocess.outputs.continue == 'true' && needs.preprocess.outputs.runner == 'hygon'
    runs-on: >-
      ${{ github.repository == 'flagos-ai/FlagGems-vllm'
          && needs.preprocess.outputs.runs_on_vllm
          || needs.preprocess.outputs.runs_on_default }}
    container:
      image: ${{ needs.preprocess.outputs.container_image }}
      options: ${{ needs.preprocess.outputs.container_options }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        continue-on-error: true
      - uses: flagos-ai/FlagGems/.github/actions/checkout-retry@master
      - uses: flagos-ai/FlagGems/.github/actions/checkout-pr@master
        with:
          pull: ${{ needs.preprocess.outputs.pull }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: flagos-ai/FlagGems/.github/actions/setup-flaggems@master
        with:
          backend: hygon
          gpu_check_script: tools/gpu_check_hygon.sh
      - uses: flagos-ai/FlagGems/.github/actions/ondemand-test@master
        with:
          op: ${{ needs.preprocess.outputs.op }}
          backend: hygon
          runner: ${{ needs.preprocess.outputs.runner }}
          existing: ${{ needs.preprocess.outputs.existing }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  test-operator-mthreads:
    needs: preprocess
    if: needs.preprocess.outputs.continue == 'true' && needs.preprocess.outputs.runner == 'mthreads'
    runs-on: >-
      ${{ github.repository == 'flagos-ai/FlagGems-vllm'
          && needs.preprocess.outputs.runs_on_vllm
          || needs.preprocess.outputs.runs_on_default }}
    container:
      image: ${{ needs.preprocess.outputs.container_image }}
      options: ${{ needs.preprocess.outputs.container_options }}
      volumes:
        - /usr/bin/mthreads-gmi:/usr/bin/mthreads-gmi:ro
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        continue-on-error: true
      - uses: flagos-ai/FlagGems/.github/actions/checkout-retry@master
      - uses: flagos-ai/FlagGems/.github/actions/checkout-pr@master
        with:
          pull: ${{ needs.preprocess.outputs.pull }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: flagos-ai/FlagGems/.github/actions/setup-flaggems@master
        with:
          backend: mthreads-musa520
          gpu_check_script: tools/gpu_check_mthreads.sh
      - uses: flagos-ai/FlagGems/.github/actions/ondemand-test@master
        with:
          op: ${{ needs.preprocess.outputs.op }}
          backend: mthreads-musa520
          runner: ${{ needs.preprocess.outputs.runner }}
          existing: ${{ needs.preprocess.outputs.existing }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  test-operator-metax:
    needs: preprocess
    if: >-
      needs.preprocess.outputs.continue == 'true' &&
      (needs.preprocess.outputs.runner == 'metax' || needs.preprocess.outputs.runner == 'maca381')
    runs-on: >-
      ${{ github.repository == 'flagos-ai/FlagGems-vllm'
          && needs.preprocess.outputs.runs_on_vllm
          || needs.preprocess.outputs.runs_on_default }}
    container:
      image: ${{ needs.preprocess.outputs.container_image }}
      options: ${{ needs.preprocess.outputs.container_options }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        continue-on-error: true
      - uses: flagos-ai/FlagGems/.github/actions/checkout-retry@master
      - uses: flagos-ai/FlagGems/.github/actions/checkout-pr@master
        with:
          pull: ${{ needs.preprocess.outputs.pull }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: flagos-ai/FlagGems/.github/actions/setup-flaggems@master
        with:
          backend: metax-maca3810
          gpu_check_script: tools/gpu_check_metax.sh
      - uses: flagos-ai/FlagGems/.github/actions/ondemand-test@master
        with:
          op: ${{ needs.preprocess.outputs.op }}
          backend: metax-maca3810
          runner: ${{ needs.preprocess.outputs.runner }}
          existing: ${{ needs.preprocess.outputs.existing }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  test-operator-iluvatar:
    needs: preprocess
    if: needs.preprocess.outputs.continue == 'true' && needs.preprocess.outputs.runner == 'iluvatar'
    runs-on: >-
      ${{ github.repository == 'flagos-ai/FlagGems-vllm'
          && needs.preprocess.outputs.runs_on_vllm
          || needs.preprocess.outputs.runs_on_default }}
    container:
      image: ${{ needs.preprocess.outputs.container_image }}
      options: ${{ needs.preprocess.outputs.container_options }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        continue-on-error: true
      - uses: flagos-ai/FlagGems/.github/actions/checkout-retry@master
      - uses: flagos-ai/FlagGems/.github/actions/checkout-pr@master
        with:
          pull: ${{ needs.preprocess.outputs.pull }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: flagos-ai/FlagGems/.github/actions/setup-flaggems@master
        with:
          backend: iluvatar
          gpu_check_script: tools/gpu_check_iluvatar.sh
      - uses: flagos-ai/FlagGems/.github/actions/ondemand-test@master
        with:
          op: ${{ needs.preprocess.outputs.op }}
          backend: iluvatar
          runner: ${{ needs.preprocess.outputs.runner }}
          existing: ${{ needs.preprocess.outputs.existing }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Kunlunxin reuses its workspace across jobs on klx-p800, so stale
  # skip-worktree bits from previous runs need clearing before checkout (see
  # backend-test.yaml for details).
  test-operator-kunlunxin:
    needs: preprocess
    if: needs.preprocess.outputs.continue == 'true' && needs.preprocess.outputs.runner == 'kunlunxin'
    runs-on: ${{ needs.preprocess.outputs.runs_on_default }}
    container:
      image: ${{ needs.preprocess.outputs.container_image }}
      options: ${{ needs.preprocess.outputs.container_options }}
    steps:
      - name: Reset reused workspace
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" 2>/dev/null || true
          cd "$GITHUB_WORKSPACE" 2>/dev/null || exit 0
          [ -d .git ] || exit 0
          git sparse-checkout disable 2>/dev/null || true
          git ls-files -z | xargs -0 -r git update-index --no-skip-worktree 2>/dev/null || true
          git reset --hard HEAD 2>/dev/null || true
          git clean -ffdx 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        continue-on-error: true
      - uses: flagos-ai/FlagGems/.github/actions/checkout-retry@master
      - uses: flagos-ai/FlagGems/.github/actions/checkout-pr@master
        with:
          pull: ${{ needs.preprocess.outputs.pull }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: flagos-ai/FlagGems/.github/actions/setup-flaggems@master
        with:
          backend: kunlunxin
          gpu_check_script: tools/gpu_check_kunlunxin.sh
      - uses: flagos-ai/FlagGems/.github/actions/ondemand-test@master
        with:
          op: ${{ needs.preprocess.outputs.op }}
          backend: kunlunxin
          runner: ${{ needs.preprocess.outputs.runner }}
          existing: ${{ needs.preprocess.outputs.existing }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
