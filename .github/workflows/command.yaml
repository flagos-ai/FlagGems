name: "ondemand test"

on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  checks: read
  contents: read

jobs:
  preprocess:
    runs-on: ubuntu-latest
    outputs:
      continue: ${{ steps.check.outputs.continue == 'true' && steps.resolve-backend.outputs.continue == 'true' }}
      op: ${{ steps.parse-command.outputs.OP_ID}}
      runner: ${{ steps.parse-command.outputs.RUNNER }}
      pull: ${{ steps.parse-command.outputs.PR_NUMBER }}
      existing: ${{ steps.parse-command.outputs.EXISTING_OP }}
      backend: ${{ steps.resolve-backend.outputs.backend }}
      vendor: ${{ steps.resolve-backend.outputs.vendor }}
      compiler: ${{ steps.resolve-backend.outputs.compiler }}
      gpu_check: ${{ steps.resolve-backend.outputs.gpu_check }}
      containerized: ${{ steps.resolve-backend.outputs.containerized }}
      container_image: ${{ steps.resolve-backend.outputs.container_image }}
      container_options: ${{ steps.resolve-backend.outputs.container_options }}
      runs_on_default: ${{ steps.resolve-backend.outputs.runs_on_default }}
      runs_on_vllm: ${{ steps.resolve-backend.outputs.runs_on_vllm }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: check
        uses: github/command@3442f3fa1efe01bdb024b157083c337902d17372  # v2.0.3
        with:
          command: "/test"
          allowed_contexts: pull_request
          allow_forks: "true"
          skip_reviews: "true"
          fork_review_bypass: "true"
          permissions: "write,admin"
          param_separator: " "

      - id: parse-command
        if: ${{ steps.check.outputs.continue == 'true' }}
        env:
          PULL_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ steps.check.outputs.comment_body }}
        run: |
          # Parse command arguments
          # Comment format: "/test <op>:<runner>", e.g. "/test constant_pad_nd:mthreads"
          params="${COMMENT_BODY#/test }"
          op="${params%%:*}"
          runner="${params##*:}"
          echo "OP_ID=${op}" >> $GITHUB_OUTPUT
          echo "RUNNER=${runner}" >> $GITHUB_OUTPUT
          echo "PR_NUMBER=${PULL_NUMBER}" >> $GITHUB_OUTPUT

          # Detect if operator exists before
          num=$(grep -rP "pytest\.mark\.${op}\b" tests | wc -l)
          if [ "$num" -eq "0" ]; then
            echo "EXISTING_OP=0" >> $GITHUB_OUTPUT
          else
            echo "EXISTING_OP=1" >> $GITHUB_OUTPUT
          fi

      # Looks up the runner alias in backends.json's command_aliases (the
      # single source of truth also used by resolve-vendor below) instead of
      # a hand-written case/dict. An alias that matches no backend (e.g.
      # "nvidia-cuda133", a backend id rather than a runner label) gets a
      # comment back listing the valid aliases, instead of silently queuing
      # against a non-existent runner.
      - id: resolve-backend
        if: ${{ steps.check.outputs.continue == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const backends = JSON.parse(fs.readFileSync('.github/backends.json', 'utf8'));
            const runner = '${{ steps.parse-command.outputs.RUNNER }}';
            const backend = backends.find(b => (b.command_aliases || []).includes(runner));

            if (!backend) {
              const aliases = backends.flatMap(b => b.command_aliases || []).sort();
              const list = aliases.map(a => `\`${a}\``).join(', ');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `⚠️ Unknown runner \`${runner}\` in \`/test\` command. Valid runners are: ${list}.`,
              });
              core.setOutput('continue', 'false');
              return;
            }

            const container = backend.container || {};
            core.setOutput('continue', 'true');
            core.setOutput('backend', backend.backend);
            core.setOutput('vendor', backend.vendor);
            core.setOutput('compiler', backend.compiler || '');
            core.setOutput('gpu_check', backend.gpu_check || '');
            core.setOutput('containerized', backend.containerized ? 'true' : 'false');
            core.setOutput('container_image', container.image || '');
            core.setOutput('container_options', container.options || '');
            core.setOutput('runs_on_default', container.runs_on_default || '');
            core.setOutput('runs_on_vllm', container.runs_on_vllm || '');

  # Generic (non-containerized) runners. Everything except the vendors whose
  # driver/runtime is only set up inside a container (containerized: true in
  # backends.json). The runner label itself (e.g. h20, a100, h100) is what
  # these machines are labeled with in GitHub Actions, independent of the
  # resolved backend/vendor. Uses local ./ action refs since these runners
  # resolve them against the checked-out workspace.
  test-operator:
    needs: preprocess
    if: >-
      needs.preprocess.outputs.continue == 'true' &&
      needs.preprocess.outputs.containerized == 'false'
    runs-on: ${{ needs.preprocess.outputs.runner }}
    env:
      COMPILER: ${{ needs.preprocess.outputs.compiler }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        continue-on-error: true
      - uses: ./.github/actions/checkout-retry
      - uses: ./.github/actions/checkout-pr
        with:
          pull: ${{ needs.preprocess.outputs.pull }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-flaggems
        with:
          backend: ${{ needs.preprocess.outputs.backend }}
          gpu_check_script: ${{ needs.preprocess.outputs.gpu_check }}
      - uses: ./.github/actions/ondemand-test
        with:
          op: ${{ needs.preprocess.outputs.op }}
          backend: ${{ needs.preprocess.outputs.backend }}
          runner: ${{ needs.preprocess.outputs.runner }}
          existing: ${{ needs.preprocess.outputs.existing }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Hygon, MetaX, MooreThreads, Iluvatar, and Kunlunxin only have their
  # driver/runtime set up inside a vendor container, mirroring backend-test.yaml.
  # The image/options/runner labels come from .github/backends.json via the
  # preprocess resolve-backend step. Each runs on whichever physical machine
  # this repo has access to (FlagGems-vllm uses the "-1" host, FlagGems uses
  # "-0"), and uses fully-qualified @master action refs since local ./ refs
  # can't be resolved inside these containers.
  test-operator-hygon:
    needs: preprocess
    if: needs.preprocess.outputs.continue == 'true' && needs.preprocess.outputs.runner == 'hygon'
    runs-on: >-
      ${{ github.repository == 'flagos-ai/FlagGems-vllm'
          && needs.preprocess.outputs.runs_on_vllm
          || needs.preprocess.outputs.runs_on_default }}
    container:
      image: ${{ needs.preprocess.outputs.container_image }}
      options: ${{ needs.preprocess.outputs.container_options }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        continue-on-error: true
      - uses: flagos-ai/FlagGems/.github/actions/checkout-retry@master
      - uses: flagos-ai/FlagGems/.github/actions/checkout-pr@master
        with:
          pull: ${{ needs.preprocess.outputs.pull }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: flagos-ai/FlagGems/.github/actions/setup-flaggems@master
        with:
          backend: ${{ needs.preprocess.outputs.backend }}
          gpu_check_script: ${{ needs.preprocess.outputs.gpu_check }}
      - uses: flagos-ai/FlagGems/.github/actions/ondemand-test@master
        with:
          op: ${{ needs.preprocess.outputs.op }}
          backend: ${{ needs.preprocess.outputs.backend }}
          runner: ${{ needs.preprocess.outputs.runner }}
          existing: ${{ needs.preprocess.outputs.existing }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  test-operator-mthreads:
    needs: preprocess
    if: needs.preprocess.outputs.continue == 'true' && needs.preprocess.outputs.runner == 'mthreads'
    runs-on: >-
      ${{ github.repository == 'flagos-ai/FlagGems-vllm'
          && needs.preprocess.outputs.runs_on_vllm
          || needs.preprocess.outputs.runs_on_default }}
    container:
      image: ${{ needs.preprocess.outputs.container_image }}
      options: ${{ needs.preprocess.outputs.container_options }}
      volumes:
        - /usr/bin/mthreads-gmi:/usr/bin/mthreads-gmi:ro
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        continue-on-error: true
      - uses: flagos-ai/FlagGems/.github/actions/checkout-retry@master
      - uses: flagos-ai/FlagGems/.github/actions/checkout-pr@master
        with:
          pull: ${{ needs.preprocess.outputs.pull }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: flagos-ai/FlagGems/.github/actions/setup-flaggems@master
        with:
          backend: ${{ needs.preprocess.outputs.backend }}
          gpu_check_script: ${{ needs.preprocess.outputs.gpu_check }}
      - uses: flagos-ai/FlagGems/.github/actions/ondemand-test@master
        with:
          op: ${{ needs.preprocess.outputs.op }}
          backend: ${{ needs.preprocess.outputs.backend }}
          runner: ${{ needs.preprocess.outputs.runner }}
          existing: ${{ needs.preprocess.outputs.existing }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  test-operator-metax:
    needs: preprocess
    if: >-
      needs.preprocess.outputs.continue == 'true' &&
      (needs.preprocess.outputs.runner == 'metax' || needs.preprocess.outputs.runner == 'maca381')
    runs-on: >-
      ${{ github.repository == 'flagos-ai/FlagGems-vllm'
          && needs.preprocess.outputs.runs_on_vllm
          || needs.preprocess.outputs.runs_on_default }}
    container:
      image: ${{ needs.preprocess.outputs.container_image }}
      options: ${{ needs.preprocess.outputs.container_options }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        continue-on-error: true
      - uses: flagos-ai/FlagGems/.github/actions/checkout-retry@master
      - uses: flagos-ai/FlagGems/.github/actions/checkout-pr@master
        with:
          pull: ${{ needs.preprocess.outputs.pull }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: flagos-ai/FlagGems/.github/actions/setup-flaggems@master
        with:
          backend: ${{ needs.preprocess.outputs.backend }}
          gpu_check_script: ${{ needs.preprocess.outputs.gpu_check }}
      - uses: flagos-ai/FlagGems/.github/actions/ondemand-test@master
        with:
          op: ${{ needs.preprocess.outputs.op }}
          backend: ${{ needs.preprocess.outputs.backend }}
          runner: ${{ needs.preprocess.outputs.runner }}
          existing: ${{ needs.preprocess.outputs.existing }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  test-operator-iluvatar:
    needs: preprocess
    if: needs.preprocess.outputs.continue == 'true' && needs.preprocess.outputs.runner == 'iluvatar'
    runs-on: >-
      ${{ github.repository == 'flagos-ai/FlagGems-vllm'
          && needs.preprocess.outputs.runs_on_vllm
          || needs.preprocess.outputs.runs_on_default }}
    container:
      image: ${{ needs.preprocess.outputs.container_image }}
      options: ${{ needs.preprocess.outputs.container_options }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        continue-on-error: true
      - uses: flagos-ai/FlagGems/.github/actions/checkout-retry@master
      - uses: flagos-ai/FlagGems/.github/actions/checkout-pr@master
        with:
          pull: ${{ needs.preprocess.outputs.pull }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: flagos-ai/FlagGems/.github/actions/setup-flaggems@master
        with:
          backend: ${{ needs.preprocess.outputs.backend }}
          gpu_check_script: ${{ needs.preprocess.outputs.gpu_check }}
      - uses: flagos-ai/FlagGems/.github/actions/ondemand-test@master
        with:
          op: ${{ needs.preprocess.outputs.op }}
          backend: ${{ needs.preprocess.outputs.backend }}
          runner: ${{ needs.preprocess.outputs.runner }}
          existing: ${{ needs.preprocess.outputs.existing }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Kunlunxin reuses its workspace across jobs on klx-p800, so stale
  # skip-worktree bits from previous runs need clearing before checkout (see
  # backend-test.yaml for details).
  test-operator-kunlunxin:
    needs: preprocess
    if: needs.preprocess.outputs.continue == 'true' && needs.preprocess.outputs.runner == 'kunlunxin'
    runs-on: ${{ needs.preprocess.outputs.runs_on_default }}
    container:
      image: ${{ needs.preprocess.outputs.container_image }}
      options: ${{ needs.preprocess.outputs.container_options }}
    steps:
      - name: Reset reused workspace
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" 2>/dev/null || true
          cd "$GITHUB_WORKSPACE" 2>/dev/null || exit 0
          [ -d .git ] || exit 0
          git sparse-checkout disable 2>/dev/null || true
          git ls-files -z | xargs -0 -r git update-index --no-skip-worktree 2>/dev/null || true
          git reset --hard HEAD 2>/dev/null || true
          git clean -ffdx 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        continue-on-error: true
      - uses: flagos-ai/FlagGems/.github/actions/checkout-retry@master
      - uses: flagos-ai/FlagGems/.github/actions/checkout-pr@master
        with:
          pull: ${{ needs.preprocess.outputs.pull }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: flagos-ai/FlagGems/.github/actions/setup-flaggems@master
        with:
          backend: ${{ needs.preprocess.outputs.backend }}
          gpu_check_script: ${{ needs.preprocess.outputs.gpu_check }}
      - uses: flagos-ai/FlagGems/.github/actions/ondemand-test@master
        with:
          op: ${{ needs.preprocess.outputs.op }}
          backend: ${{ needs.preprocess.outputs.backend }}
          runner: ${{ needs.preprocess.outputs.runner }}
          existing: ${{ needs.preprocess.outputs.existing }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
