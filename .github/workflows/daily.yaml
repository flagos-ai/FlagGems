# Daily testing workflow
#
# This script is designed to be triggered on the provided cron time,
# and it can be manually triggered. The purposes of this script include:
#
# - running all unit tests against all operators for correctness verification;
# - running all performance tests (benchmarks) against all operators to
#   validate if there are performance regress;
# - running all SVT tests where selected models are launched for E2E tests.
#
# TODO(Qiming): Enable daily tests for benchmark and the remaining backends

name: daily
permissions:
  contents: read

on:
  workflow_dispatch:

  schedule:
    # Note that the time is in UTC, so we want this to start at 01:23+8:00
    - cron: '23 17 * * *'

jobs:
  prepare:
    # Runs on the self-hosted cpu-runner instead of ubuntu-latest: this job
    # only echoes a date (no GitHub API calls), and scheduling it on a
    # GitHub-hosted runner lets the cron run sit in the hosted-fleet queue
    # for hours during peak load, delaying every downstream job. cpu-runner is
    # dedicated and immediately available, so the workflow starts at the cron
    # time instead of whenever GitHub frees a hosted runner.
    runs-on: cpu-runner
    outputs:
      datetime: ${{ steps.get-date.outputs.CURRENT_DATE }}
    steps:
      - id: get-date
        shell: bash
        run: |
          echo "CURRENT_DATE=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"

  cpp-op:
    needs: prepare
    uses: ./.github/workflows/cpp-op-test.yaml

  python-op:
    needs: prepare
    concurrency:
      group: python-op-${{ needs.prepare.outputs.datetime }}-shard${{ matrix.shard_index }}
      cancel-in-progress: true
    runs-on: jiuding
    # Without an explicit timeout, the runner's default cap cuts quick-mode
    # shards off mid-run (every cancelled daily run died at ~95 min). 1440
    # mirrors ops-test.yaml; quick mode finishes well under this, so the
    # ceiling only protects against a genuinely hung shard.
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        continue-on-error: true
      - uses: flagos-ai/FlagOps/actions/checkout-retry@main

      - shell: bash
        run: tools/gpu_check_nvidia.sh

      - name: Precompile flag_gems Python bytecode
        shell: bash
        run: python3 -m compileall -q src/flag_gems/

      - shell: bash
        env:
          CHANGED_FILES: '__ALL__'
          TOTAL_SHARDS: '8'
          SHARD_INDEX: ${{ matrix.shard_index }}
          QUICK_TESTS: '1'
        run: |
          # Invoke script to run full-range unit tests,
          # Use datetime timestamp as the fake PR ID, with optional affix if
          # workflow is triggered manually
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
             RUN_TAG="${{ needs.prepare.outputs.datetime}}-manual"
          else
             RUN_TAG="${{ needs.prepare.outputs.datetime}}"
          fi

          # Save RUN_TAG for next step to use
          echo "RUN_TAG=${RUN_TAG}" >> $GITHUB_ENV

          bash tools/test-op.sh ${RUN_TAG}-shard${{ matrix.shard_index }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: op-ut-coverage-shard${{ matrix.shard_index }}
          path: coverage/

  # Full-range unit tests on Ascend. Runner label and GPU check script match
  # the ascend-cann900 entry in .github/backends.json.
  ascend-op:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3, 4, 5, 6, 7]
    uses: ./.github/workflows/backend-test.yaml
    with:
      backend: ascend-cann900
      runner_label: cann9
      gpu_check_script: tools/gpu_check_ascend.sh
      changed_files: '__ALL__'
      pr_id: ${{ needs.prepare.outputs.datetime }}${{ github.event_name == 'workflow_dispatch' && '-manual' || '' }}-ascend-shard${{ matrix.shard_index }}
      total_shards: '8'
      shard_index: ${{ format('{0}', matrix.shard_index) }}
      quick_tests: 'true'
    secrets:
      RUNNER_SSH_KEY: ${{ secrets.RUNNER_SSH_KEY }}

  examples:
    needs: prepare
    concurrency:
      group: examples-test-${{ needs.prepare.outputs.datetime }}
      cancel-in-progress: true
    runs-on: jiuding
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        continue-on-error: true
      - uses: flagos-ai/FlagOps/actions/checkout-retry@main

      - shell: bash
        run: tools/gpu_check_nvidia.sh
      - shell: bash
        env:
          CHANGED_FILES: '__ALL__'
        run: |
          # Invoke script to run full-range example tests,
          # Use datetime timestamp as the fake PR ID, with optional affix if
          # workflow is triggered manually
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
             PR_ID="${{ needs.prepare.outputs.datetime}}-manual"
          else
             PR_ID="${{ needs.prepare.outputs.datetime}}"
          fi
          bash tools/test-examples.sh ${PR_ID}
