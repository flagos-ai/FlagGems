---
name: Backend Test

on:
  workflow_call:
    inputs:
      backend:
        description: 'FlagGems backend label (e.g. nvidia-cuda133, mthreads-musa520, ascend-cann900)'
        required: true
        type: string
      runner_label:
        description: 'GitHub Actions runner label'
        required: true
        type: string
      gpu_check_script:
        description: 'Path to GPU check script (leave empty to skip)'
        required: false
        type: string
        default: ''
      changed_files:
        description: 'List of changed files in a PR'
        required: false
        type: string
        default: ''
      pr_id:
        description: 'ID of the PR'
        required: false
        type: string
        default: ''
      test_script:
        description: "Temporary parameter for alpha-ops test"
        required: false
        type: string
        default: ''
    secrets:
      RUNNER_SSH_KEY:
        required: true

permissions:
  contents: read

jobs:
  test:
    if: ${{ inputs.backend != 'iluvatar' && inputs.backend != 'kunlunxin' && inputs.backend != 'thead' }}
    runs-on: ${{ inputs.runner_label }}
    concurrency:
      group: >-
        op-test-${{ inputs.backend }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        continue-on-error: true
      - uses: ./.github/actions/checkout-retry
      - uses: ./.github/actions/setup-flaggems
        with:
          backend: ${{ inputs.backend }}
          gpu_check_script: ${{ inputs.gpu_check_script }}

      - name: Test alpha ops
        if: ${{ inputs.test_script != '' }}
        env:
          CHANGED_FILES: ${{ inputs.changed_files }}
        shell: bash
        run: |
          bash ${{ inputs.test_script }} ${{ inputs.backend }} ${{ inputs.pr_id }}
      - name: Run backend tests
        if: ${{ inputs.test_script == '' }}
        shell: bash
        env:
          CHANGED_FILES: ${{ inputs.changed_files }}
        run: |
          source .venv/bin/activate
          tools/test-op.sh ${{ inputs.pr_id }}

  # Kunlunxin runs inside a container on the klx-p800-1 server, since the XPU
  # driver/runtime it needs is only set up inside this image.
  # Equivalent to:
  #   docker run --rm -it \
  #     harbor.baai.ac.cn/flagos-base/flagos-base-kunlunxin-xre5.37.1:2.1.2 bash
  # with GitHub Actions creating/starting the container and exec'ing each step.
  test-kunlunxin:
    if: ${{ inputs.backend == 'kunlunxin' }}
    runs-on: klx-p800-1
    container:
      image: harbor.baai.ac.cn/flagos-base/flagos-base-kunlunxin-xre5.37.1:2.1.2
      options: --device /dev/xpu0 --device /dev/xpuctrl --shm-size=256g --ulimit memlock=-1 --ulimit stack=67108864
    concurrency:
      group: >-
        op-test-${{ inputs.backend }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        continue-on-error: true
      - uses: ./.github/actions/checkout-retry
      - uses: ./.github/actions/setup-flaggems
        with:
          backend: ${{ inputs.backend }}
          gpu_check_script: ${{ inputs.gpu_check_script }}

      - name: Test alpha ops
        if: ${{ inputs.test_script != '' }}
        env:
          CHANGED_FILES: ${{ inputs.changed_files }}
        shell: bash
        run: |
          bash ${{ inputs.test_script }} ${{ inputs.backend }} ${{ inputs.pr_id }}
      - name: Run backend tests
        if: ${{ inputs.test_script == '' }}
        shell: bash
        env:
          CHANGED_FILES: ${{ inputs.changed_files }}
        run: |
          source .venv/bin/activate
          tools/test-op.sh ${{ inputs.pr_id }}

  # THead runs inside a container on the flagcicd-810e runner, since the PPU
  # driver/runtime it needs is only set up inside this image.
  # Equivalent to:
  #   docker run --rm -it --device=/dev/alixpu_ctl --device=/dev/alixpu \
  #     --shm-size=256g --ulimit memlock=-1 --ulimit stack=67108864 \
  #     pkg.flytiger-eco.com/docker_release/llm:v2.1.1-pytorch2.10.0-ubuntu24.04-cuda13.0-py312 bash
  # with GitHub Actions creating/starting the container and exec'ing each step.
  test-thead:
    if: ${{ inputs.backend == 'thead' }}
    runs-on: flagcicd-810e
    container:
      image: pkg.flytiger-eco.com/docker_release/llm:v2.1.1-pytorch2.10.0-ubuntu24.04-cuda13.0-py312
      options: --device=/dev/alixpu_ctl --device=/dev/alixpu --shm-size=256g --ulimit memlock=-1 --ulimit stack=67108864
    concurrency:
      group: >-
        op-test-${{ inputs.backend }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        continue-on-error: true
      - uses: ./.github/actions/checkout-retry
      - uses: ./.github/actions/setup-flaggems
        with:
          backend: ${{ inputs.backend }}
          gpu_check_script: ${{ inputs.gpu_check_script }}

      - name: Test alpha ops
        if: ${{ inputs.test_script != '' }}
        env:
          CHANGED_FILES: ${{ inputs.changed_files }}
        shell: bash
        run: |
          bash ${{ inputs.test_script }} ${{ inputs.backend }} ${{ inputs.pr_id }}
      - name: Run backend tests
        if: ${{ inputs.test_script == '' }}
        shell: bash
        env:
          CHANGED_FILES: ${{ inputs.changed_files }}
        run: |
          source .venv/bin/activate
          tools/test-op.sh ${{ inputs.pr_id }}

  # Iluvatar runs inside a container on whichever iluvatar-bi-v150-* server
  # this repo has access to. Different repos share this workflow file but
  # each can only reach one of the two physical machines, so the runner
  # label is derived from github.repository (which resolves to the base repo
  # even for fork PRs, unlike vars/secrets which are withheld from forks):
  # FlagGems uses iluvatar-bi-v150-0, FlagGems-vllm uses iluvatar-bi-v150-1.
  # Equivalent to:
  #   docker run --rm -it --device /dev/iluvatar0 --device /dev/itrctl \
  #     --shm-size=256g --ulimit memlock=-1 --ulimit stack=67108864 \
  #     harbor.baai.ac.cn/flagos-base/flagos-base-iluvatar-corex4.5.0:2.1.2 bash
  # with GitHub Actions creating/starting the container and exec'ing each step.
  test-iluvatar:
    if: ${{ inputs.backend == 'iluvatar' }}
    runs-on: >-
      ${{ github.repository == 'flagos-ai/FlagGems-vllm'
          && 'iluvatar-bi-v150-1'
          || 'iluvatar-bi-v150-0' }}
    container:
      image: harbor.baai.ac.cn/flagos-base/flagos-base-iluvatar-corex4.5.0:2.1.2
      options: --device /dev/iluvatar0 --device /dev/itrctl --shm-size=256g --ulimit memlock=-1 --ulimit stack=67108864
    concurrency:
      group: >-
        op-test-${{ inputs.backend }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        continue-on-error: true
      - uses: ./.github/actions/checkout-retry
      - uses: ./.github/actions/setup-flaggems
        with:
          backend: ${{ inputs.backend }}
          gpu_check_script: ${{ inputs.gpu_check_script }}

      - name: Test alpha ops
        if: ${{ inputs.test_script != '' }}
        env:
          CHANGED_FILES: ${{ inputs.changed_files }}
        shell: bash
        run: |
          bash ${{ inputs.test_script }} ${{ inputs.backend }} ${{ inputs.pr_id }}
      - name: Run backend tests
        if: ${{ inputs.test_script == '' }}
        shell: bash
        env:
          CHANGED_FILES: ${{ inputs.changed_files }}
        run: |
          source .venv/bin/activate
          tools/test-op.sh ${{ inputs.pr_id }}
