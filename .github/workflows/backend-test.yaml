---
name: Backend Test

on:
  workflow_call:
    inputs:
      backend:
        description: 'FlagGems backend label (e.g. nvidia-cuda133, mthreads-musa520, ascend-cann900)'
        required: true
        type: string
      runner_label:
        description: 'GitHub Actions runner label'
        required: true
        type: string
      gpu_check_script:
        description: 'Path to GPU check script (leave empty to skip)'
        required: false
        type: string
        default: ''
      changed_files:
        description: 'List of changed files in a PR'
        required: false
        type: string
        default: ''
      pr_id:
        description: 'ID of the PR'
        required: false
        type: string
        default: ''
      test_script:
        description: "Temporary parameter for alpha-ops test"
        required: false
        type: string
        default: ''
    secrets:
      RUNNER_SSH_KEY:
        required: true

permissions:
  contents: read

jobs:
  test:
    if: ${{ inputs.backend != 'iluvatar' && inputs.backend != 'kunlunxin' }}
    runs-on: ${{ inputs.runner_label }}
    concurrency:
      group: >-
        op-test-${{ inputs.backend }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        continue-on-error: true
      - uses: ./.github/actions/checkout-retry
      - uses: ./.github/actions/setup-flaggems
        with:
          backend: ${{ inputs.backend }}
          gpu_check_script: ${{ inputs.gpu_check_script }}

      - name: Test alpha ops
        if: ${{ inputs.test_script != '' }}
        env:
          CHANGED_FILES: ${{ inputs.changed_files }}
        shell: bash
        run: |
          bash ${{ inputs.test_script }} ${{ inputs.backend }} ${{ inputs.pr_id }}
      - name: Run backend tests
        if: ${{ inputs.test_script == '' }}
        shell: bash
        env:
          CHANGED_FILES: ${{ inputs.changed_files }}
        run: |
          source .venv/bin/activate
          tools/test-op.sh ${{ inputs.pr_id }}

  # Kunlunxin runs inside a container on the klx-p800-1 server, since the XPU
  # driver/runtime it needs is only set up inside this image.
  # Equivalent to:
  #   docker run --rm -it \
  #     harbor.baai.ac.cn/flagos-base/flagos-base-kunlunxin-xre5.37.1:2.1.2 bash
  # with GitHub Actions creating/starting the container and exec'ing each step.
  test-kunlunxin:
    if: ${{ inputs.backend == 'kunlunxin' }}
    runs-on: klx-p800-1
    container:
      image: harbor.baai.ac.cn/flagos-base/flagos-base-kunlunxin-xre5.37.1:2.1.2
      options: --device /dev/xpu0 --device /dev/xpuctrl
    concurrency:
      group: >-
        op-test-${{ inputs.backend }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        continue-on-error: true
      - uses: ./.github/actions/checkout-retry
      # TEMP probe: dump container environment to diagnose gpu_check / torch.
      # Revert before merge.
      - name: Probe kunlunxin container environment
        shell: bash
        run: |
          echo "=== os / arch ==="; uname -a; cat /etc/os-release 2>/dev/null | head -3
          echo "=== xpu-smi present? ==="; which xpu-smi || echo "xpu-smi NOT on PATH"
          echo "=== XPU_HOME / /usr/local/xpu ==="; echo "XPU_HOME=${XPU_HOME:-unset}"; ls -d /usr/local/xpu* 2>/dev/null || echo "no /usr/local/xpu*"
          echo "=== xpu-smi output ==="; /usr/local/xpu/bin/xpu-smi 2>&1 | head -30 || xpu-smi 2>&1 | head -30 || echo "xpu-smi failed"
          echo "=== /dev devices ==="; ls -l /dev | grep -iE "xpu|klx|p800" || echo "no xpu/klx/p800 device nodes in /dev"
          echo "=== pip index / env hints ==="; env | grep -iE "PIP_|INDEX|XPU|XRE|PATH=" | head -20
      - uses: ./.github/actions/setup-flaggems
        with:
          backend: ${{ inputs.backend }}
          gpu_check_script: ${{ inputs.gpu_check_script }}

      # TEMP probe: inspect installed torch and flag_gems device. Revert before merge.
      - name: Probe torch / flag_gems after setup
        shell: bash
        run: |
          source .venv/bin/activate
          echo "=== pip torch packages ==="; uv pip freeze | grep -iE "^torch|xmlir|xpu|triton|flagtree|flag" || true
          echo "=== python torch info ==="
          python3 - <<'PY' 2>&1 | head -40
          import torch
          print("torch:", torch.__version__)
          print("torch file:", torch.__file__)
          for attr in ("cuda", "xpu"):
              m = getattr(torch, attr, None)
              avail = getattr(m, "is_available", lambda: "n/a")() if m else "no attr"
              print(f"torch.{attr}.is_available:", avail)
          try:
              import flag_gems
              print("flag_gems.device:", flag_gems.device)
          except Exception as e:
              print("flag_gems import error:", repr(e))
          PY

      - name: Test alpha ops
        if: ${{ inputs.test_script != '' }}
        env:
          CHANGED_FILES: ${{ inputs.changed_files }}
        shell: bash
        run: |
          bash ${{ inputs.test_script }} ${{ inputs.backend }} ${{ inputs.pr_id }}
      - name: Run backend tests
        if: ${{ inputs.test_script == '' }}
        shell: bash
        env:
          CHANGED_FILES: ${{ inputs.changed_files }}
        run: |
          source .venv/bin/activate
          tools/test-op.sh ${{ inputs.pr_id }}

  # Iluvatar runs inside a container on the iluvatar-bi-v150-0 server, since
  # the corex driver/runtime it needs is only set up inside this image.
  # Equivalent to:
  #   docker run --rm -it --device /dev/iluvatar0 \
  #     harbor.baai.ac.cn/flagos-base/flagos-base-iluvatar-corex4.5.0:2.1.2 bash
  # with GitHub Actions creating/starting the container and exec'ing each step.
  test-iluvatar:
    if: ${{ inputs.backend == 'iluvatar' }}
    runs-on: iluvatar-bi-v150-0
    container:
      image: harbor.baai.ac.cn/flagos-base/flagos-base-iluvatar-corex4.5.0:2.1.2
      options: --device /dev/iluvatar0
    concurrency:
      group: >-
        op-test-${{ inputs.backend }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        continue-on-error: true
      - uses: ./.github/actions/checkout-retry
      - uses: ./.github/actions/setup-flaggems
        with:
          backend: ${{ inputs.backend }}
          gpu_check_script: ${{ inputs.gpu_check_script }}

      - name: Test alpha ops
        if: ${{ inputs.test_script != '' }}
        env:
          CHANGED_FILES: ${{ inputs.changed_files }}
        shell: bash
        run: |
          bash ${{ inputs.test_script }} ${{ inputs.backend }} ${{ inputs.pr_id }}
      - name: Run backend tests
        if: ${{ inputs.test_script == '' }}
        shell: bash
        env:
          CHANGED_FILES: ${{ inputs.changed_files }}
        run: |
          source .venv/bin/activate
          tools/test-op.sh ${{ inputs.pr_id }}
