# Triggered after rule-check completes (including fork PRs).
# workflow_run runs in the base repo context, so secrets are available.
name: ci-report-feishu

on:
  workflow_run:
    workflows: ["rule-check"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  report-to-feishu:
    # Runs on cpu-runner (self-hosted): ci_report_feishu.py uses only stdlib
    # (no pip install needed) and the script only calls the Feishu and GitHub
    # APIs over HTTPS — the injected proxy on cpu-runner reaches both fine.
    # Moving off ubuntu-latest frees a hosted runner slot for PR CI jobs.
    runs-on: cpu-runner
    env:
      http_proxy: ${{ secrets.CI_HTTP_PROXY }}
      https_proxy: ${{ secrets.CI_HTTP_PROXY }}
    steps:
      - uses: flagos-ai/FlagOps/actions/robust-checkout@main
        with:
          ssh-key: ${{ secrets.CI_SSH_KEY }}
          rounds: "5"
      - name: Report to Feishu
        env:
          FEISHU_BITABLE_APP_ID: ${{ secrets.FEISHU_BITABLE_APP_ID }}
          FEISHU_BITABLE_APP_SECRET: ${{ secrets.FEISHU_BITABLE_APP_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Wait briefly for GitHub API to fully sync the completed run
          sleep 5

          # Retry up to 3 times with exponential backoff
          for attempt in 1 2 3; do
            if python3 tools/ci_report_feishu.py \
              --app-id "${FEISHU_BITABLE_APP_ID}" \
              --app-secret "${FEISHU_BITABLE_APP_SECRET}" \
              --github-token "${GITHUB_TOKEN}" \
              --repo "${{ github.repository }}" \
              --workflow "rule-check"; then
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              echo "Attempt $attempt failed, retrying in $((attempt * 10))s..."
              sleep $((attempt * 10))
            fi
          done

          echo "All retry attempts failed"
          exit 1
