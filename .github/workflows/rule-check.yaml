name: rule-check

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  derive-changed-operators:
    runs-on: ubuntu-latest
    outputs:
      changed_operators: ${{ steps.derive.outputs.changed_operators }}
      changed_files: ${{ steps.derive.outputs.changed_files }}
      has_changes: ${{ steps.derive.outputs.has_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Derive changed operators
        id: derive
        run: |
          python tools/ci_checks/derive_changed_operators.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

  check-operators-yaml:
    runs-on: ubuntu-latest
    needs: derive-changed-operators
    if: needs.derive-changed-operators.outputs.has_changes == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Check operators.yaml
        run: |
          python tools/ci_checks/check_operators_yaml.py \
            --operators '${{ needs.derive-changed-operators.outputs.changed_operators }}'

  check-init-exports:
    runs-on: ubuntu-latest
    needs: derive-changed-operators
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.11'
      - name: Check __init__.py exports and registry
        run: python tools/ci_checks/check_init_exports.py

  check-kernelgen-tests:
    runs-on: ubuntu-latest
    needs: derive-changed-operators
    if: needs.derive-changed-operators.outputs.has_changes == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Check KernelGen tests for use_gems
        run: |
          python tools/ci_checks/check_kernelgen_tests.py \
            --operators '${{ needs.derive-changed-operators.outputs.changed_operators }}'

  check-operator-markers:
    runs-on: ubuntu-latest
    needs: derive-changed-operators
    if: needs.derive-changed-operators.outputs.has_changes == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Check operator test files and markers
        run: |
          python tools/ci_checks/check_operator_markers.py \
            --operators '${{ needs.derive-changed-operators.outputs.changed_operators }}'

  check-aten-operators:
    runs-on: ubuntu-latest
    needs: derive-changed-operators
    if: needs.derive-changed-operators.outputs.has_changes == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Check aten operator names
        run: |
          python tools/ci_checks/check_aten_operators.py \
            --operators '${{ needs.derive-changed-operators.outputs.changed_operators }}'

  # --- Warning-only checks (Phase 3) ---
  # These emit ::warning annotations but always exit 0

  check-api-logs:
    runs-on: ubuntu-latest
    needs: derive-changed-operators
    if: needs.derive-changed-operators.outputs.has_changes == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Check API logging convention
        run: |
          python tools/ci_checks/check_api_logs.py \
            --operators '${{ needs.derive-changed-operators.outputs.changed_operators }}'

  check-benchmark-coverage:
    runs-on: ubuntu-latest
    needs: derive-changed-operators
    if: needs.derive-changed-operators.outputs.has_changes == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Check benchmark coverage
        run: |
          python tools/ci_checks/check_performance_reference.py \
            --operators '${{ needs.derive-changed-operators.outputs.changed_operators }}'

  # --- CI Report: push results to Feishu Bitable ---
  report-to-feishu:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - derive-changed-operators
      - check-operators-yaml
      - check-init-exports
      - check-kernelgen-tests
      - check-operator-markers
      - check-aten-operators
      - check-api-logs
      - check-benchmark-coverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: tools/ci_report_feishu.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.11'
      - name: Report to Feishu
        env:
          FEISHU_BITABLE_APP_ID: ${{ secrets.FEISHU_BITABLE_APP_ID }}
          FEISHU_BITABLE_APP_SECRET: ${{ secrets.FEISHU_BITABLE_APP_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/ci_report_feishu.py \
            --app-id "${FEISHU_BITABLE_APP_ID}" \
            --app-secret "${FEISHU_BITABLE_APP_SECRET}" \
            --github-token "${GITHUB_TOKEN}" \
            --repo "${{ github.repository }}" \
            --workflow "rule-check"
