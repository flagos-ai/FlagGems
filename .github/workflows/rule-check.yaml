name: rule-check

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Job name kept as rule-check-required (not renamed) because the repo's
  # branch ruleset for master already lists "rule-check-required" as a
  # required status check context; renaming would silently break that check.
  rule-check-required:
    # Runs on GitHub-hosted ubuntu-latest: avoids the self-hosted cpu-runner's
    # flaky network (injected proxy wedges git fetches ~1/3 of the time).
    # Standard actions/checkout connects directly to GitHub; no proxy needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # fetch-depth 0 required by derive_changed_operators.py (base...head
          # diff). On ubuntu-latest a full clone is fast via GitHub's own network.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.11'
          cache: pip

      # pre-commit hook environments are cached by their config hash so they are
      # only rebuilt when .pre-commit-config.yaml changes. On a cache hit the
      # install step is skipped entirely; on a miss the venvs are built once and
      # saved for subsequent runs.
      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-${{ runner.os }}-

      # Pinned so a new pre-commit/pyyaml release can't silently change hook
      # behavior or break on a cache miss; bump deliberately when needed.
      - name: Install pre-commit and pyyaml
        run: pip install "pre-commit==4.2.0" "pyyaml==6.0.2"

      - name: Run pre-commit (code style)
        run: pre-commit run --show-diff-on-failure --color=always --all-files

      # rule-check steps only make sense on pull_request events (they need a
      # base SHA to diff against). On push-to-master the code-style check above
      # is sufficient.
      - name: Derive changed operators
        id: derive
        if: github.event_name == 'pull_request'
        run: |
          python3 tools/ci_checks/derive_changed_operators.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

      - name: Check operators.yaml
        id: check-operators-yaml
        if: github.event_name == 'pull_request' && steps.derive.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          python3 tools/ci_checks/check_operators_yaml.py \
            --operators '${{ steps.derive.outputs.changed_operators }}'

      - name: Check __init__.py exports and registry
        id: check-init-exports
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: python3 tools/ci_checks/check_init_exports.py

      - name: Check changed test files for use_gems
        id: check-kernelgen-tests
        if: github.event_name == 'pull_request' && steps.derive.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          python3 tools/ci_checks/check_kernelgen_tests.py \
            --changed-files '${{ steps.derive.outputs.changed_files }}' \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

      - name: Check operator test files and markers
        id: check-operator-markers
        if: github.event_name == 'pull_request' && steps.derive.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          python3 tools/ci_checks/check_operator_markers.py \
            --operators '${{ steps.derive.outputs.changed_operators }}'

      - name: Check aten operator names
        id: check-aten-operators
        if: github.event_name == 'pull_request' && steps.derive.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          python3 tools/ci_checks/check_aten_operators.py \
            --operators '${{ steps.derive.outputs.changed_operators }}'

      # --- Warning-only checks (emit ::warning annotations, always exit 0) ---

      - name: Check API logging convention
        if: github.event_name == 'pull_request' && steps.derive.outputs.has_changes == 'true'
        run: |
          python3 tools/ci_checks/check_api_logs.py \
            --operators '${{ steps.derive.outputs.changed_operators }}'

      - name: Check benchmark coverage
        if: github.event_name == 'pull_request' && steps.derive.outputs.has_changes == 'true'
        run: |
          python3 tools/ci_checks/check_performance_reference.py \
            --operators '${{ steps.derive.outputs.changed_operators }}'

      - name: Verify required checks passed
        if: always() && github.event_name == 'pull_request'
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          failed=0
          for step_id in check-operators-yaml check-init-exports check-kernelgen-tests check-operator-markers check-aten-operators; do
            result=$(echo "$STEPS_JSON" | jq -r --arg id "$step_id" '.[$id].outcome // "skipped"')
            echo "$step_id: $result"
            if [ "$result" = "failure" ]; then
              failed=1
            fi
          done
          if [ "$failed" != "0" ]; then
            echo "::error::One or more required checks failed"
            exit 1
          fi
