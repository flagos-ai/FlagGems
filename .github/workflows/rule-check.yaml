name: rule-check

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # checkout registers the workspace as a safe git directory only in a
  # throwaway HOME; the check scripts (derive_changed_operators, etc.) then run
  # git with HOME=/github/home and git rejects the dir as dubious ownership
  # ("fatal: not a git repository"). Trust it for every git call in the job via
  # git's env-based config.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: '*'

jobs:
  # All checks run as steps in a single job so the repo is only checked out
  # once on cpu-runner (a self-hosted runner where repeated checkouts are
  # slow). Each check step uses `continue-on-error: true` so a failure
  # doesn't skip the remaining checks; "Verify required checks passed"
  # inspects step outcomes at the end and fails the job if a required check
  # failed.
  #
  # Job name kept as rule-check-required (not renamed to rule-check) because
  # the repo's branch ruleset for master already lists "rule-check-required"
  # as a required status check context; renaming this job would silently
  # break that check if the ruleset is ever re-enabled.
  rule-check-required:
    # cpu-runner is an already-running container; no container: image needed.
    runs-on: cpu-runner
    env:
      # Override the platform-injected proxy (which fails ~1/3 of git fetches)
      # with a working one from secrets, so actions/checkout's fetch is reliable.
      # Only lowercase: GitHub treats env names case-insensitively, so defining
      # both http_proxy and HTTP_PROXY is a duplicate-key error that fails the
      # whole workflow to parse. git/curl honor the lowercase names.
      http_proxy: ${{ secrets.CI_HTTP_PROXY }}
      https_proxy: ${{ secrets.CI_HTTP_PROXY }}
    steps:
      # Robust checkout: probes SSH then HTTP ~10s each, hard-kills a hung
      # fetch, rotates links across rounds. This is
      # .github/actions/robust-checkot inlined on purpose: a `uses:` of a
      # same-repo composite action makes the runner download the whole repo as
      # a tarball from codeload.github.com during "Prepare all required
      # actions", which times out through the flaky proxy (3 x 100s, no link
      # rotation possible) before ANY step can run. A local `uses: ./...` path
      # can't be used for the checkout step itself (the repo isn't checked out
      # yet), so the script lives here verbatim. fetch-depth 0 for base...head
      # diffs; ssh-key empty on fork PRs -> SSH skipped, token HTTP used.
      - name: Robust checkout
        shell: bash
        env:
          RC_REPO: ${{ github.repository }}
          RC_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          RC_DEPTH: "0"
          RC_SSH_KEY: ${{ secrets.CI_SSH_KEY }}
          RC_PROBE: "10"
          # ~10 min of rotation (30 rounds x [SSH 10s + HTTP 10s]) to ride out
          # windows where both links are temporarily down; a good link still
          # hits on round 1 (~10s), so this only costs time when the network is
          # fully unreachable.
          RC_ROUNDS: "30"
          RC_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"

          # Trust the workspace for every later git call (pre-commit,
          # ci_checks), otherwise HOME=/github/home git calls hit
          # dubious-ownership.
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true

          # Fresh repo each run: the cpu-runner reuses _work across runs and a
          # stale index/sparse state can hide tracked files. Start clean.
          rm -rf .git
          git init -q
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true

          depth_arg=""
          [ "$RC_DEPTH" != "0" ] && depth_arg="--depth=$RC_DEPTH"

          # SSH link (only if a key was provided — fork PRs pass empty).
          ssh_ready=0
          if [ -n "$RC_SSH_KEY" ]; then
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            printf '%s\n' "$RC_SSH_KEY" > ~/.ssh/rc_key && chmod 600 ~/.ssh/rc_key
            ssh_ready=1
          fi
          SSH_URL="git@github.com:${RC_REPO}.git"
          # ServerAlive* makes SSH drop a silently-wedged connection after
          # ~10s (5s x 2) of no response, so a hung SSH fetch aborts on its own
          # instead of transferring nothing until the hard timeout. A fetch
          # that is slow but still moving keeps its keepalives answered and
          # survives.
          SSH_CMD="ssh -i $HOME/.ssh/rc_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=2"

          # HTTP link via the injected proxy, authenticated with the job token.
          HTTP_URL="https://x-access-token:${RC_TOKEN}@github.com/${RC_REPO}.git"

          # Abort a link within ~10s if it isn't moving fast enough, then
          # rotate:
          #   HTTP: git aborts if transfer stays < 20 KiB/s for lowSpeedTime
          #         (10s).
          #   SSH : ServerAlive* (in SSH_CMD) drops a wedged connection in
          #         ~10s.
          # The low-speed checks only start once bytes flow; a stall BEFORE any
          # transfer (TLS / proxy-CONNECT hang, the common failure here)
          # wouldn't trigger them, so the hard SIGKILL timeout is also the 10s
          # probe window to cap that case. A healthy pre-check fetch finishes
          # in a few seconds, so this does not kill normal (even moderately
          # slow) fetches.
          LOW_LIMIT=20480              # bytes/sec (20 KiB/s)
          LOW_TIME="$RC_PROBE"         # seconds under the limit before aborting
          HARD="$RC_PROBE"             # hard kill (s): also caps connect stalls
          try_fetch() {  # $1=label $2=url  (GIT_SSH_COMMAND set by caller if ssh)
            git remote remove origin 2>/dev/null || true
            git remote add origin "$2"
            local start end ms
            start=$(date +%s%N)
            if timeout -s KILL "$HARD" git \
                 -c http.lowSpeedLimit="$LOW_LIMIT" -c http.lowSpeedTime="$LOW_TIME" \
                 fetch -q --no-tags --prune $depth_arg origin "$RC_REF"; then
              end=$(date +%s%N); ms=$(( (end-start)/1000000 ))
              echo "  $1: ok ${ms}ms"
              return 0
            fi
            end=$(date +%s%N); ms=$(( (end-start)/1000000 ))
            echo "  $1: FAIL ${ms}ms"
            return 1
          }

          ok=0
          for r in $(seq 1 "$RC_ROUNDS"); do
            echo "=== round $r ==="
            # A fetch hard-killed by the probe timeout leaves .git/shallow.lock
            # (and possibly index.lock) behind; every later round would then
            # fail instantly with "Unable to create ... shallow.lock: File
            # exists" even once the network recovers. Clear stale locks before
            # each attempt.
            rm -f .git/shallow.lock .git/index.lock 2>/dev/null || true
            if [ "$ssh_ready" = 1 ]; then
              if GIT_SSH_COMMAND="$SSH_CMD" try_fetch "ssh" "$SSH_URL"; then ok=1; break; fi
            else
              echo "  ssh: skipped (no key)"
            fi
            if try_fetch "http" "$HTTP_URL"; then ok=1; break; fi
          done

          # Scrub credentials regardless of outcome.
          rm -f ~/.ssh/rc_key 2>/dev/null || true
          git remote set-url origin "https://github.com/${RC_REPO}.git" 2>/dev/null || true

          if [ "$ok" != 1 ]; then
            echo "::error::robust-checkout: all links failed after $RC_ROUNDS rounds"
            exit 1
          fi

          git checkout -q --force FETCH_HEAD
          echo "robust-checkout: done ($(git rev-parse --short HEAD))"
      - name: Ensure full working tree
        shell: bash
        run: |
          # cpu-runner reuses its _work dir across workflow runs. A prior
          # run's sparse checkout (e.g. unittest preprocess fetching only
          # .github/backends.json) leaves skip-worktree bits behind; the next
          # checkout's "sparse-checkout disable" runs after it unsets
          # extensions.worktreeConfig, so it can't clear them and tracked files
          # (tools/ci_checks/*.py) stay absent even though checkout reports
          # success and `git log` shows the right HEAD. Clear any skip-worktree
          # bits and force-restore the full tree. Harmless no-op when clean.
          git sparse-checkout disable 2>/dev/null || true
          git ls-files -z | xargs -0 -r git update-index --no-skip-worktree
          git checkout --force HEAD -- .
      # pyyaml (the only third-party import in tools/ci_checks/*.py) is
      # preinstalled in the cpu-runner image, so no install step is needed here.

      - name: Derive changed operators
        id: derive
        run: |
          python3 tools/ci_checks/derive_changed_operators.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

      - name: Check operators.yaml
        id: check-operators-yaml
        if: steps.derive.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          python3 tools/ci_checks/check_operators_yaml.py \
            --operators '${{ steps.derive.outputs.changed_operators }}'

      - name: Check __init__.py exports and registry
        id: check-init-exports
        continue-on-error: true
        run: python3 tools/ci_checks/check_init_exports.py

      - name: Check changed test files for use_gems
        id: check-kernelgen-tests
        if: steps.derive.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          python3 tools/ci_checks/check_kernelgen_tests.py \
            --changed-files '${{ steps.derive.outputs.changed_files }}' \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

      - name: Check operator test files and markers
        id: check-operator-markers
        if: steps.derive.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          python3 tools/ci_checks/check_operator_markers.py \
            --operators '${{ steps.derive.outputs.changed_operators }}'

      - name: Check aten operator names
        id: check-aten-operators
        if: steps.derive.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          python3 tools/ci_checks/check_aten_operators.py \
            --operators '${{ steps.derive.outputs.changed_operators }}'

      # --- Warning-only checks (Phase 3) ---
      # These emit ::warning annotations but always exit 0, so they don't
      # need continue-on-error.

      - name: Check API logging convention
        if: steps.derive.outputs.has_changes == 'true'
        run: |
          python3 tools/ci_checks/check_api_logs.py \
            --operators '${{ steps.derive.outputs.changed_operators }}'

      - name: Check benchmark coverage
        if: steps.derive.outputs.has_changes == 'true'
        run: |
          python3 tools/ci_checks/check_performance_reference.py \
            --operators '${{ steps.derive.outputs.changed_operators }}'

      - name: Verify required checks passed
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          failed=0
          for step_id in check-operators-yaml check-init-exports check-kernelgen-tests check-operator-markers check-aten-operators; do
            result=$(echo "$STEPS_JSON" | jq -r --arg id "$step_id" '.[$id].outcome // "skipped"')
            echo "$step_id: $result"
            if [ "$result" = "failure" ]; then
              failed=1
            fi
          done
          if [ "$failed" != "0" ]; then
            echo "::error::One or more required checks failed"
            exit 1
          fi
